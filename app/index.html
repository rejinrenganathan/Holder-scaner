<!doctype html>
<html lang="en">
<head>

<title>Scan Holders</title>
<style>
:root{--sat:0px;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#38383a;--line2:#48484a;--tx:#fff;--tx2:#8e8e93;--tx3:#636366;
--acc:#0a84ff;--accbg:rgba(10,132,255,.18);--ok:#30d158;--okbg:rgba(48,209,88,.16);--wa:#ff9f0a;--wabg:rgba(255,159,10,.16);--er:#ff453a;--erbg:rgba(255,69,58,.16);
--pr:#bf5af2;--prbg:rgba(191,90,242,.18);color-scheme:dark}
@media (display-mode: standalone){:root{--sat:env(safe-area-inset-top)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.wrap>*{animation:in .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{position:fixed;top:0;left:0;right:0;z-index:6;height:calc(44px + var(--sat));padding:var(--sat) 8px 0;display:flex;align-items:center;justify-content:center;
 background:rgba(22,22,24,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(84,84,88,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.bar.show{opacity:1;pointer-events:auto}.bar b{font-size:17px;font-weight:600}
.ann{background:var(--accbg);color:var(--acc);border-radius:12px;padding:10px 14px;font-size:14px;margin:calc(10px + var(--sat)) 0 -4px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:calc(14px + var(--sat)) 0 12px}
.ann+.top{padding-top:14px}.ann+.ann{margin-top:14px}
.top h1{font-size:34px;font-weight:700;margin:0;line-height:1.1}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);border:0;display:inline-flex;align-items:center;justify-content:center;color:var(--acc);cursor:pointer;flex:none}
.ib:active{transform:scale(.9)}.ib svg{width:21px;height:21px}
.mu{color:var(--tx2);font-size:13px}.mu3{color:var(--tx3);font-size:12px}
.sec{color:var(--tx2);font-size:13px;text-transform:uppercase;letter-spacing:.3px;margin:22px 16px 7px}
.cd{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-height:28px}.ht{font-weight:600;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:.5px solid var(--line);padding:10px 0;min-height:48px}
.row:first-child,.hd+.row{border-top:0}.tap{cursor:pointer}.tap:active{opacity:.6}
.chev{color:var(--tx3);font-size:20px}
.pl{font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;white-space:nowrap;display:inline-block}
.ok{background:var(--okbg);color:var(--ok)}.wa{background:var(--wabg);color:var(--wa)}.er{background:var(--erbg);color:var(--er)}.ac{background:var(--accbg);color:var(--acc)}.pr{background:var(--prbg);color:var(--pr)}.ne{background:var(--card2);color:var(--tx2)}
.sm{font-size:10.5px;padding:1px 5px;border-radius:5px}
.bt{border:0;background:var(--card2);color:var(--acc);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:500;cursor:pointer;text-align:center;min-height:44px;text-decoration:none;display:inline-block}
.bt:active{transform:scale(.97);opacity:.8}.bp{background:var(--acc);color:#fff}.bd{color:var(--er)}.bt[disabled]{opacity:.4}.wide{width:100%;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp{background:var(--card2);border-radius:12px;padding:10px 12px}.kn{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--card);border-radius:10px;padding:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px 2px;font-size:13.5px;font-weight:500;border-radius:8px;cursor:pointer}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.ch{border:0;background:var(--card2);border-radius:16px;padding:6px 13px;font-size:14px;white-space:nowrap;cursor:pointer}.ch.on{background:var(--tx);color:#000}
textarea,input[type=text]{width:100%;border:0;background:var(--card2);border-radius:10px;padding:11px 12px;outline:none;font-size:16px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:110px;resize:vertical}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--acc)}
.tg{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;border:0;flex:none;cursor:pointer;transition:background .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.3,1.4,.6,1)}
.tg.on{background:var(--ok)}.tg.on::after{left:22px}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none}.rad.on{border:7px solid var(--acc)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom));
 background:rgba(18,18,18,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(84,84,88,.5)}
.nav button{background:none;border:0;font-size:10.5px;font-weight:500;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:48px}
.nav button.on{color:var(--acc)}.nav svg{width:26px;height:26px}.nav button.on svg{fill:currentColor;fill-opacity:.22}
/* token rows */
.tk{display:flex;align-items:center;gap:11px;border-top:.5px solid var(--line);padding:10px 0;cursor:pointer}
.tk:first-child{border-top:0}.tk:active{opacity:.6}
.av{width:40px;height:40px;border-radius:50%;background:var(--card2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--tx2)}
.av img{width:100%;height:100%;object-fit:cover}
.tm{flex:1;min-width:0}.tm>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{font-weight:600;font-size:16px}.t2{font-size:13px;color:var(--tx2);margin-top:1px}
.tr{text-align:right;flex:none;font-variant-numeric:tabular-nums}.tr .t2{font-weight:600}
.up{color:var(--ok)}.dn{color:var(--er)}
.lockwrap{position:relative}.blur{filter:blur(6px);opacity:.55;pointer-events:none;user-select:none}
.unlock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.unlock .cd{box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center;max-width:300px;margin:0;background:#2c2c2e}
/* sheets */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{background:#1c1c1e;width:100%;max-width:600px;border-radius:14px 14px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .32s cubic-bezier(.2,.9,.25,1) both}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 12px}
.sheet h3{margin:4px 0 12px;font-size:20px}
.sheet .cd{background:var(--card2)}.sheet .kp{background:#3a3a3c}
.as{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom));animation:fade .2s both}
.as .grp{background:rgba(44,44,46,.96);border-radius:14px;overflow:hidden;max-width:600px;width:100%;margin:0 auto 8px;animation:up .3s both}
.as .t{padding:13px 16px;text-align:center;color:var(--tx2);font-size:13px;border-bottom:.5px solid var(--line2)}
.as button{display:block;width:100%;background:none;border:0;border-top:.5px solid var(--line2);padding:16px;font-size:19px;color:var(--acc);cursor:pointer}
.as .t+button,.as button:first-child{border-top:0}.as button.dg{color:var(--er)}.as .cancel{font-weight:600}
.toast{position:fixed;left:50%;top:calc(10px + var(--sat));transform:translateX(-50%);background:rgba(44,44,46,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 16px;border-radius:16px;font-size:15px;z-index:30;max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:drop .35s both}
@keyframes drop{from{transform:translate(-50%,-120%)}}
.meter{height:6px;background:var(--card2);border-radius:4px;margin-top:8px;overflow:hidden}.meter div{height:6px;border-radius:4px;background:var(--acc)}
.center{text-align:center}.mt{margin-top:10px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,#1c1c1e 25%,#2c2c2e 50%,#1c1c1e 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:14px}
@keyframes shim{to{background-position:-200% 0}}
.err{color:var(--er);font-size:14px}
.addr{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.hero{padding:calc(60px + var(--sat)) 8px 20px;text-align:center}
.logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#0a84ff,#bf5af2);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(10,132,255,.35)}
.logo svg{width:42px;height:42px;color:#fff}
.hero h1{font-size:34px;margin:0 0 8px}.hero p{color:var(--tx2);margin:0 auto 26px;max-width:320px;font-size:17px}
.feat{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 0}
.fi{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center mu" style="padding:80px 0"><span class="spin"></span></div></div>
<div class="bar" id="bar"><b id="barT"></b></div>
<nav class="nav" id="nav" style="display:none"></nav>
<script>
'use strict';
const API = 'https://holder-scan-api.rejinrenganathan.workers.dev';
const TK = 'sh_token', SEEN = 'sh_seen';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = w => w ? w.slice(0, 4) + '…' + w.slice(-4) : '';
const fmt = n => Number(n || 0).toLocaleString('en-US');
const ago = ts => { if (!ts) return '—'; const d = Math.max(0, Math.floor(Date.now() / 1000) - ts); return d < 60 ? d + 's' : d < 3600 ? Math.floor(d / 60) + 'm' : d < 86400 ? Math.floor(d / 3600) + 'h' : Math.floor(d / 86400) + 'd'; };
const usd = n => n == null ? '—' : n >= 1e9 ? '$' + (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? '$' + (n / 1e3).toFixed(1) + 'K' : '$' + Math.round(n);
const sol = n => (Math.round((n || 0) * 100) / 100) + ' SOL';
const pct = n => n == null ? '' : `<span class="${n >= 0 ? 'up' : 'dn'}">${n >= 0 ? '+' : ''}${Math.round(n)}%</span>`;
const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };
const PLAN = { m1: '1 month', m3: '3 months', m6: '6 months', m12: '12 months', lifetime: 'Founder lifetime', free: 'Free', owner: 'Owner' };
const KIND = { kol: ['KOL', 'pr'], smart: ['Smart', 'ac'], mine: ['Yours', 'ok'] };
const kindTag = k => { const x = KIND[k] || KIND.smart; return `<span class="pl sm ${x[1]}">${x[0]}</span>`; };
const ICON = {
  feed: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>', trades: '<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>',
  wallets: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>', alerts: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  account: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.4-7 8-7s7 2.5 8 7"/>', refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  scan: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2M8.5 11h5M11 8.5v5"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

let token = localStorage.getItem(TK) || '', me = null, SITE = null, tab = 'feed', PAYSEL = '';

// ---------- network ----------
async function api(path, opt = {}) {
  let r;
  try { r = await fetch(API + path, { method: opt.body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: opt.body ? JSON.stringify(opt.body) : undefined }); }
  catch (e) { throw new Error('No connection — check your internet'); }
  let j = null; try { j = await r.json(); } catch (e) { }
  if (j && j.down) { downScreen(j.error); throw new Error('down'); }
  if (r.status === 401 && token && !/auth\/logout/.test(path)) { token = ''; me = null; localStorage.removeItem(TK); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'The server answered ' + r.status);
  return j;
}
// token names, pictures and prices come straight from DexScreener (free, no key)
const META = new Map();
async function meta(mints) {
  const need = [...new Set(mints)].filter(m => { const c = META.get(m); return !c || Date.now() - c.t > 60000; });
  for (let i = 0; i < need.length; i += 30) {
    const part = need.slice(i, i + 30);
    try {
      const r = await fetch('https://api.dexscreener.com/tokens/v1/solana/' + part.join(','));
      const list = r.ok ? await r.json() : [];
      const best = {};
      for (const p of Array.isArray(list) ? list : []) { const a = p.baseToken && p.baseToken.address; if (!a || !part.includes(a)) continue; if (!best[a] || ((p.liquidity || {}).usd || 0) > ((best[a].liquidity || {}).usd || 0)) best[a] = p; }
      for (const m of part) { const p = best[m]; META.set(m, { t: Date.now(), d: p ? { sym: p.baseToken.symbol, name: p.baseToken.name, img: p.info && p.info.imageUrl, mc: p.marketCap || p.fdv, liq: p.liquidity && p.liquidity.usd, ch5: p.priceChange && p.priceChange.m5, ch1: p.priceChange && p.priceChange.h1, ch24: p.priceChange && p.priceChange.h24, age: p.pairCreatedAt, url: p.url, price: p.priceUsd } : null }); }
    } catch (e) { }
  }
}
const M = m => (META.get(m) || {}).d || null;

// ---------- small UI pieces ----------
function toast(msg) { document.querySelectorAll('.toast').forEach(t => t.remove()); buzz(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function sheet(html, bind) {
  closeSheet(); const bg = document.createElement('div'); bg.className = 'sheetbg'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`; bg.onclick = e => { if (e.target === bg) closeSheet(); };
  document.body.appendChild(bg); if (bind) bind(bg);
  const sh = bg.querySelector('.sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0 && !e.target.closest('input,textarea')) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; } }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener('touchend', () => { if (y0 == null) return; y0 = null; sh.style.transition = 'transform .25s'; if (dy > 110) closeSheet(); else sh.style.transform = ''; });
}
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }
function menu(items, title) {
  document.querySelectorAll('.as').forEach(m => m.remove()); buzz(6);
  const m = document.createElement('div'); m.className = 'as';
  m.innerHTML = `<div class="grp">${title ? `<div class="t">${esc(title)}</div>` : ''}</div><div class="grp"><button class="cancel">Cancel</button></div>`;
  const g = m.querySelector('.grp');
  items.forEach(([label, fn, danger]) => { const b = document.createElement('button'); b.textContent = label; if (danger) b.className = 'dg'; b.onclick = () => { m.remove(); fn(); }; g.appendChild(b); });
  m.querySelector('.cancel').onclick = () => m.remove(); m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
}
function busy(b, on) { if (!b) return; if (on) { b.dataset.t = b.innerHTML; b.innerHTML = '<span class="spin"></span>'; b.disabled = true; } else { b.innerHTML = b.dataset.t || b.innerHTML; b.disabled = false; } }
async function act(b, fn) { busy(b, true); try { await fn(); } catch (e) { if (e.message !== 'down') toast(e.message); } finally { busy(b, false); } }
function copy(text, label) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(label || 'Copied')).catch(() => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(label || 'Copied'); }); }
function header(title, right) {
  $('#barT').textContent = title;
  const ann = (SITE && SITE.announce ? `<div class="ann">${esc(SITE.announce)}</div>` : '') + (typeof renewBanner === 'function' ? renewBanner() : '');
  return `${ann}<div class="top"><h1>${esc(title)}</h1><div style="display:flex;gap:8px">${right || ''}</div></div>`;
}
window.addEventListener('scroll', () => $('#bar').classList.toggle('show', scrollY > 50), { passive: true });
const skel = n => Array.from({ length: n }, () => '<div class="sk" style="height:62px;margin-bottom:8px"></div>').join('');
const av = (d, mint) => `<div class="av">${d && d.img ? `<img src="${esc(d.img)}" loading="lazy" alt="" onerror="this.remove()">` : esc(((d && d.sym) || mint).slice(0, 2).toUpperCase())}</div>`;
function lockCard(locked, what) {
  return `<div class="cd"><div class="ht">🔒 ${fmt(locked)} more ${what}</div>
   <div class="mu" style="margin:4px 0 12px">Free shows the top ${SITE ? SITE.free_tokens : 4}. Get every ${what.replace(/s$/, '')}, every buyer and your own wallets with a plan.</div>
   <button class="bt bp wide" onclick="go('account')">See plans</button></div>`;
}

// ---------- shell ----------
const TABS = [['feed', 'Feed'], ['trades', 'Trades'], ['wallets', 'Wallets'], ['alerts', 'Alerts'], ['account', 'Account']];
function go(t) {
  closeSheet(); document.querySelectorAll('.as').forEach(m => m.remove());
  tab = TABS.some(x => x[0] === t) ? t : 'feed';
  if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
  $('#nav').style.display = '';
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-t="${k}">${svg(k)}${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { buzz(5); if (b.dataset.t === tab) { scrollTo({ top: 0, behavior: 'smooth' }); return; } go(b.dataset.t); });
  scrollTo(0, 0); render();
}
function render() { if (tab === 'pay') return; clearTimeout(TIMER); ({ feed: Feed, trades: Trades, wallets: Wallets, alerts: Alerts, account: Account })[tab](); }
let TIMER = 0;
const autoRefresh = fn => { clearTimeout(TIMER); TIMER = setTimeout(() => { if (document.visibilityState === 'visible' && !$('#sheet') && !document.querySelector('.as')) fn(true); else autoRefresh(fn); }, 20000); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (tab === 'feed' || tab === 'trades') && !$('#sheet')) render(); });

// ---------- welcome + sign-in ----------
function provider() { const w = window; return (w.phantom && w.phantom.solana) || w.solflare || (w.backpack && w.backpack.solana) || w.solana || null; }
function signInBlock(msg) {

async function solanaSignIn(p) {
  let res; try { res = await p.connect(); } catch (e) { throw new Error('Cancelled in the wallet — nothing was signed'); }
  const wallet = ((res && res.publicKey) || p.publicKey).toString();
  const n = await api('/api/auth/nonce', { body: { wallet } });
  let sig; try { sig = await p.signMessage(new TextEncoder().encode(n.message), 'utf8'); } catch (e) { throw new Error(/reject|cancel|denied/i.test(e.message || '') ? 'Cancelled in the wallet — nothing was signed' : 'The wallet could not sign: ' + (e.message || e)); }
  const bytes = sig.signature || sig; let bin = ''; new Uint8Array(bytes).forEach(x => bin += String.fromCharCode(x));
  const r = await api('/api/auth/solana', { body: { wallet, nonce: n.nonce, signature: btoa(bin) } });
  signedIn(r);
}

// ---------- payments (SOL) ----------
// The server gives a one-time reference key. The wallet sends exactly the price to the payment wallet with that key attached,
// and the server finds the transfer by the key. The transaction is built here by hand (a plain SOL transfer), no extra library.
const PAYK = 'sh_pay', DAYS = { m1: 30, m3: 90, m6: 180, m12: 365 };
const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function b58enc(bytes) { let n = 0n; for (const b of bytes) n = n * 256n + BigInt(b); let s = ''; while (n > 0n) { s = B58[Number(n % 58n)] + s; n /= 58n; } for (const b of bytes) { if (b) break; s = '1' + s; } return s; }
function b58dec(s) {
  if (typeof s !== 'string' || !/^[1-9A-HJ-NP-Za-km-z]+$/.test(s)) return null;
  let n = 0n; for (const c of s) n = n * 58n + BigInt(B58.indexOf(c));
  const out = []; while (n > 0n) { out.unshift(Number(n % 256n)); n /= 256n; }
  for (const c of s) { if (c !== '1') break; out.unshift(0); }
  return new Uint8Array(out);
}
// legacy message: transfer `lamports` from payer to `to`, with the reference key as a read-only account (Solana Pay style)
function transferMessage(payer, to, ref, lamports, blockhash) {
  if (payer === to) throw new Error('Pay from a different wallet than the Scan Holders payment wallet');
  const keys = [payer, to, ref, '11111111111111111111111111111111'].map(b58dec), bh = b58dec(blockhash);
  if (keys.some(k => !k || k.length !== 32) || !bh || bh.length !== 32) throw new Error('Payment details look wrong — close this and try again');
  const data = new Uint8Array(12), dv = new DataView(data.buffer); dv.setUint32(0, 2, true); dv.setBigUint64(4, BigInt(lamports), true);
  return new Uint8Array([1, 0, 2, 4, ...keys.flatMap(k => [...k]), ...bh, 1, 3, 3, 0, 1, 2, 12, ...data]);
}
// wallets announce themselves through the Wallet Standard (Phantom, Solflare, Backpack all do)
function stdWallets() {
  return new Promise(res => {
    const list = [], reg = { register: (...ws) => { list.push(...ws); return () => { }; } };
    const h = e => { try { e.detail(reg); } catch (x) { } };
    window.addEventListener('wallet-standard:register-wallet', h);
    try { window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: reg })); } catch (x) { }
    setTimeout(() => { window.removeEventListener('wallet-standard:register-wallet', h); res(list.filter(w => w && w.features && w.features['solana:signAndSendTransaction'])); }, 300);
  });
}
const brandOf = p => !p ? '' : p.isSolflare ? 'Solflare' : p.isBackpack ? 'Backpack' : 'Phantom';
async function payWithWallet(ref) {
  const p = provider(), brand = brandOf(p), ws = await stdWallets();
  const w = ws.find(x => brand && new RegExp(brand, 'i').test(x.name || '')) || ws[0];
  const fresh = async () => { const it = (await api('/api/pay/intent', { body: { ref } })).payment; if (it.status !== 'pending') throw new Error(it.status === 'paid' ? 'This plan is already paid' : 'This payment is closed — start again'); return it; };
  if (w) {
    let acc = (w.accounts || [])[0];
    if (!acc) { const c = w.features['standard:connect']; if (!c) throw new Error('Could not connect the wallet'); const r = await c.connect(); acc = ((r && r.accounts) || w.accounts || [])[0]; }
    if (!acc) throw new Error('The wallet did not share an account');
    const it = await fresh(), payer = acc.address || b58enc(acc.publicKey);
    const msg = transferMessage(payer, it.recipient, it.ref, it.lamports, it.blockhash);
    const tx = new Uint8Array(65 + msg.length); tx[0] = 1; tx.set(msg, 65);   // 1 empty signature + message
    const out = await w.features['solana:signAndSendTransaction'].signAndSendTransaction({ account: acc, transaction: tx, chain: 'solana:mainnet' });
    const r0 = Array.isArray(out) ? out[0] : out;
    return r0 && r0.signature ? (typeof r0.signature === 'string' ? r0.signature : b58enc(r0.signature)) : '';
  }
  if (p && p.request) {   // older Phantom
    const c = await p.connect(); const payer = ((c && c.publicKey) || p.publicKey).toString(), it = await fresh();
    const r = await p.request({ method: 'signAndSendTransaction', params: { message: b58enc(transferMessage(payer, it.recipient, it.ref, it.lamports, it.blockhash)) } });
    return (r && r.signature) || '';
  }
  throw new Error('No wallet found here — open this page in Phantom or Solflare');
}
const walletErr = e => { const m = String((e && e.message) || e || ''); return e && e.code === 4001 || /reject|cancel|denied|declin|closed/i.test(m) ? 'Cancelled — nothing was sent' : /insufficient|not enough|0x1\b/i.test(m) ? 'Not enough SOL in this wallet (the price plus a tiny network fee)' : m || 'The wallet could not send the payment'; };
// payment requests waiting for the network — kept on this phone so they're checked again next time the app opens
const pend = () => { try { return JSON.parse(localStorage.getItem(PAYK) || '[]').filter(x => x && x.ref && Date.now() - x.t < 48 * 3600e3); } catch (e) { return []; } };
function savePending(ref) { const l = pend().filter(x => x.ref !== ref); l.unshift({ ref, t: Date.now() }); localStorage.setItem(PAYK, JSON.stringify(l.slice(0, 5))); }
function dropPending(ref) { localStorage.setItem(PAYK, JSON.stringify(pend().filter(x => x.ref !== ref))); }
const dateOf = ts => new Date(ts * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const planActiveMe = () => me && me.plan !== 'free' && (me.plan === 'lifetime' || me.planUntil * 1000 > Date.now());
function endsText(plan) {
  if (plan === 'lifetime') return 'Pay once · yours for good';
  const d = DAYS[plan], on = planActiveMe() && me.plan !== 'lifetime', base = on ? me.planUntil : Math.floor(Date.now() / 1000);
  return `${on ? `Adds ${d} days to your plan` : `${d} days`} · ends ${dateOf(base + d * 86400)}`;
}
function payButtons(it) {
  const p = provider(), link = location.origin + location.pathname + '?payref=' + it.ref;
  return p ? `<button class="bt bp wide" id="payw">Pay ${it.sol} SOL with ${brandOf(p)}</button>`
    : `<a class="bt bp wide" href="https://phantom.app/ul/browse/${encodeURIComponent(link)}?ref=${encodeURIComponent(location.origin)}">Pay in Phantom</a>
       <a class="bt wide mt" href="https://solflare.com/ul/v1/browse/${encodeURIComponent(link)}?ref=${encodeURIComponent(location.origin)}">Pay in Solflare</a>
       <a class="bt wide mt" href="${esc(it.url)}" style="background:none">Other Solana wallet</a>`;
}
function bindPay(root, it) {
  const b = root.querySelector('#payw'); if (!b) return;
  b.onclick = () => act(b, async () => {
    const st = $('#pst'); st.textContent = 'Confirm in your wallet…';
    let sig; try { sig = await payWithWallet(it.ref); } catch (e) { st.innerHTML = '&nbsp;'; throw new Error(walletErr(e)); }
    savePending(it.ref); const bx = $('#pbtns'); if (bx) bx.style.display = 'none';
    st.innerHTML = `<span class="spin"></span> Sent — waiting for the network to confirm…${sig ? ` <a href="https://solscan.io/tx/${esc(sig)}" target="_blank" rel="noopener">View</a>` : ''}`;
    watchPay(it.ref, 1500);
  });
}
async function paySheet(plan) {
  if (!me) return signInSheet('Sign in first so the plan goes to your account.');
  sheet(`<h3>${esc(PLAN[plan])}</h3><div class="center" style="padding:34px 0"><span class="spin"></span></div>`);
  let it; try { it = (await api('/api/pay/start', { body: { plan } })).payment; }
  catch (e) { if (e.message !== 'down') sheet(`<h3>${esc(PLAN[plan])}</h3><div class="err">${esc(e.message)}</div><button class="bt wide mt" onclick="closeSheet()">Close</button>`); return; }
  savePending(it.ref);
  sheet(`<h3>Get ${esc(PLAN[it.plan])}</h3>
   <div class="cd center" style="padding:16px"><div class="kn" style="font-size:34px">${it.sol} SOL</div><div class="mu">${it.usd ? '≈ $' + fmt(Math.round(it.sol * it.usd)) + ' · ' : ''}${esc(endsText(it.plan))}</div></div>
   <div id="pbtns">${payButtons(it)}</div><div class="mu center mt" id="pst">&nbsp;</div>
   <div class="mu3 center mt">Sends exactly ${it.sol} SOL to Scan Holders (${short(it.recipient)}). Your plan turns on by itself once the network confirms — usually within a minute. A different amount is not accepted and gets refunded by hand.</div>`, bg => bindPay(bg, it));
  watchPay(it.ref, 4000);
}
// poll while the sheet is open; checking again right away when you come back from the wallet app
let PW = { ref: '', timer: 0, until: 0 };
function watchPay(ref, first) {
  clearTimeout(PW.timer); PW = { ref, timer: 0, until: Date.now() + 15 * 60e3 };
  const tick = async () => {
    if (PW.ref !== ref) return;
    const st = $('#pst'); if (!st) { PW.ref = ''; return; }
    if (document.visibilityState === 'visible') { try { if (payResult(await api('/api/pay/check', { body: { ref } }))) return; } catch (e) { } }
    if (Date.now() > PW.until) { st.textContent = 'Still waiting. If you paid, your plan turns on by itself — you can close this.'; PW.ref = ''; return; }
    PW.timer = setTimeout(tick, 4000);
  };
  PW.tick = tick; PW.timer = setTimeout(tick, first || 4000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && PW.ref && PW.tick) { clearTimeout(PW.timer); PW.timer = setTimeout(PW.tick, 300); } });
function payResult(j) {
  const p = j.payment; if (j.user) me = j.user;
  if (p.status === 'pending') return false;
  dropPending(p.ref); PW.ref = '';
  if (tab === 'pay') { PayDone(p); return true; }
  if (p.status === 'paid') {
    buzz(30);
    sheet(`<div class="center" style="padding:10px 0 4px"><div style="font-size:54px;line-height:1">✅</div><h3 style="margin-top:12px">Payment confirmed</h3>
      <div class="mu">${esc(PLAN[p.plan])} is on${p.until > 0 ? ' · ends ' + dateOf(p.until) : p.until === -1 ? ' · never expires' : ''}</div>
      ${p.sig ? `<a class="mu3" href="https://solscan.io/tx/${esc(p.sig)}" target="_blank" rel="noopener">Receipt on Solscan</a>` : ''}</div>
      <button class="bt bp wide mt" id="pdone">Done</button>`, bg => { bg.querySelector('#pdone').onclick = () => { closeSheet(); render(); }; });
  } else if (p.status === 'review') {
    sheet(`<h3>We got your payment</h3><div class="mu">${esc(p.note || 'It could not be used for this plan')}. It will be sent back to your wallet by hand — no need to do anything.</div><button class="bt wide mt" onclick="closeSheet();render()">OK</button>`);
  } else sheet(`<h3>Payment closed</h3><div class="mu">This payment request expired. Start again from Account if you still want the plan.</div><button class="bt wide mt" onclick="closeSheet()">OK</button>`);
  return true;
}
// payments made earlier (app was closed before the network confirmed)
async function checkPendingQuiet() {
  for (const x of pend()) {
    try { const j = await api('/api/pay/check', { body: { ref: x.ref } }); if (j.user) me = j.user;
      if (j.payment.status === 'pending') continue; dropPending(x.ref);
      if (j.payment.status === 'paid') { toast(`Payment confirmed — ${PLAN[j.payment.plan]} is on`); if (tab === 'account' && !$('#sheet')) render(); }
    } catch (e) { }
  }
}
// opened from a payment link inside Phantom / Solflare (no sign-in needed: the link itself is the ticket)
async function PayScreen(ref) {
  tab = 'pay'; $('#nav').style.display = 'none';
  $('#app').innerHTML = `<div class="hero"><div class="logo">${svg('scan')}</div><h1 style="font-size:28px">Scan Holders</h1><p><span class="spin"></span></p></div>`;
  let it; try { it = (await api('/api/pay/intent', { body: { ref } })).payment; }
  catch (e) { if (e.message !== 'down') $('#app').innerHTML = `<div class="hero"><div class="logo">${svg('scan')}</div><h1 style="font-size:26px">Payment link</h1><p>${esc(e.message)}</p><a class="bt" href="${location.pathname}">Open Scan Holders</a></div>`; return; }
  if (it.status !== 'pending') return PayDone(it);
  savePending(ref);
  $('#app').innerHTML = `<div class="hero" style="padding-bottom:10px"><div class="logo">${svg('scan')}</div><h1 style="font-size:28px">Pay for Scan Holders</h1><p style="margin-bottom:0">${esc(PLAN[it.plan])}${it.account ? ' · for ' + esc(it.account) : ''}</p></div>
   <div class="cd center" style="padding:18px"><div class="kn" style="font-size:36px">${it.sol} SOL</div><div class="mu">Sent to Scan Holders · ${short(it.recipient)}</div></div>
   <div id="pbtns">${payButtons(it)}</div><div class="mu center mt" id="pst">&nbsp;</div>
   <div class="mu3 center mt">The plan turns on by itself once the network confirms. Then go back to Scan Holders.</div>`;
  bindPay($('#app'), it); watchPay(ref, 2000);
}
function PayDone(p) {
  const ok = p.status === 'paid';
  $('#app').innerHTML = `<div class="hero"><div style="font-size:64px;line-height:1;margin-bottom:16px">${ok ? '✅' : p.status === 'review' ? '↩️' : '⌛'}</div>
   <h1 style="font-size:28px">${ok ? 'Paid' : p.status === 'review' ? 'Payment received' : 'Payment closed'}</h1>
   <p>${ok ? `${esc(PLAN[p.plan])} is on${p.until > 0 ? ' until ' + dateOf(p.until) : ''}. Go back to Scan Holders — it updates by itself.` : p.status === 'review' ? esc((p.note || 'It could not be used for this plan') + '. It will be sent back to your wallet by hand.') : 'This payment request expired. Start again from Account in Scan Holders.'}</p>
   ${p.sig ? `<a class="bt wide" href="https://solscan.io/tx/${esc(p.sig)}" target="_blank" rel="noopener">Receipt on Solscan</a>` : ''}
   <a class="bt bp wide mt" href="${location.pathname}">Open Scan Holders</a></div>`;
}
function renewBanner() {
  if (!me || me.plan === 'free' || me.plan === 'lifetime' || me.isAdmin || !me.planUntil || tab === 'account') return '';
  const left = me.planUntil - Date.now() / 1000; if (left <= 0 || left > 3 * 86400) return '';
  if (localStorage.getItem('sh_renew') === new Date().toDateString()) return '';
  const d = Math.ceil(left / 86400);
  return `<div class="ann" id="renew" style="background:var(--wabg);color:var(--wa);display:flex;gap:10px;align-items:center"><span style="flex:1" onclick="go('account')">Your plan ends ${d <= 1 ? 'within a day' : 'in ' + d + ' days'} — tap to renew</span><span onclick="localStorage.setItem('sh_renew', new Date().toDateString());this.parentNode.remove()" style="font-size:20px;line-height:1;padding:0 2px">×</span></div>`;
}

// ---------- Account ----------
async function Account() {
  const prices = (SITE && SITE.prices) || {}, payOn = !!(SITE && SITE.payments === '1');
  const keys = ['m1', 'm3', 'm6', 'm12', 'lifetime'].filter(k => prices[k] != null && (k !== 'lifetime' || (SITE.founder === '1' && SITE.founderLeft > 0)));
  if (!keys.includes(PAYSEL)) PAYSEL = keys.includes('m3') ? 'm3' : keys[0];
  const timedOn = me && planActiveMe() && me.plan !== 'lifetime' && !me.isAdmin;
  const plansHtml = keys.map(k => {
    const per = { m1: 1, m3: 3, m6: 6, m12: 12 }[k], save = per && per > 1 && prices.m1 ? Math.round((1 - prices[k] / (prices.m1 * per)) * 100) : 0;
    const on = payOn && k === PAYSEL;
    return `<div class="row ${payOn ? 'tap' : ''}" data-p="${k}" style="${on ? 'background:var(--accbg);margin:0 -16px;padding:10px 16px;border-radius:10px;border-top-color:transparent' : ''}">
      ${payOn ? `<span class="rad${on ? ' on' : ''}"></span>` : ''}<div style="flex:1"><div>${PLAN[k]} ${k === 'lifetime' ? '<span class="pl sm pr">Founder</span>' : save > 0 ? `<span class="pl sm ok">Save ${save}%</span>` : ''}</div>
      <div class="mu">${k === 'lifetime' ? `Pay once · ${fmt(SITE.founderLeft)} of ${fmt(SITE.founder_max)} left` : per > 1 ? (Math.round(prices[k] / per * 100) / 100) + ' SOL a month' : 'Monthly'}</div></div><b>${prices[k]} SOL</b></div>`; }).join('');
  const plans = `<div class="sec">${timedOn ? 'Renew or change plan' : 'Plans'}</div><div class="cd">${plansHtml}
    <button class="bt ${payOn ? 'bp' : ''} wide mt" id="pay" ${payOn && PAYSEL ? '' : 'disabled'}>${!payOn ? 'Payments open soon' : !me ? 'Sign in to get a plan' : `Pay ${prices[PAYSEL]} SOL`}</button>
    <div class="mu3 center mt">${payOn && timedOn ? 'Renewing adds the days on top of the time you have left. ' : ''}Pay in SOL from your wallet. Unlocks every token, every buyer and ${fmt(SITE ? SITE.paid_wallets : 4000)} wallets.</div></div>`;
  const legal = `<div class="cd" style="padding:2px 16px"><div class="row tap" data-l="terms"><span>Terms</span><span class="chev">›</span></div><div class="row tap" data-l="privacy"><span>Privacy</span><span class="chev">›</span></div><div class="row tap" data-l="risk"><span>Not financial advice</span><span class="chev">›</span></div></div>
   <div class="mu3 center" style="margin-top:14px">Scan Holders</div>`;
  if (!me) {
    $('#app').innerHTML = header('Account') + `<div class="cd center" style="padding:22px 16px"><div class="ht">You're browsing free</div><div class="mu" style="margin:6px 0 16px">Sign in to add your own wallets and get a plan.</div>${SITE && SITE.signups !== '1' ? '<div class="mu">New sign-ups are paused right now</div>' : signInBlock()}</div>` + plans + legal;
    if (!SITE || SITE.signups === '1') bindSignIn();
  } else {
    const plan = me.isAdmin ? 'owner' : me.plan, days = me.planUntil ? Math.max(0, Math.ceil((me.planUntil - Date.now() / 1000) / 86400)) : 0;
    $('#app').innerHTML = header('Account') + `<div class="cd"><div class="row" style="min-height:56px"><div style="min-width:0"><div class="ht">${esc(me.name || me.email || short(me.wallet))}</div><div class="mu">${me.name || me.email ? (me.wallet ? 'Wallet ' + short(me.wallet) : 'Google account') : 'Signed in with your wallet'}</div></div>
       <span class="pl ${plan === 'free' ? 'ne' : 'ok'}">${esc(PLAN[plan] || plan)}</span></div>
      ${plan !== 'free' && plan !== 'owner' ? `<div class="row"><span>${plan === 'lifetime' ? 'Never expires' : 'Days left'}</span><b style="${plan !== 'lifetime' && days <= 3 ? 'color:var(--wa)' : ''}">${plan === 'lifetime' ? '∞' : days + (days <= 3 ? ' · renew below' : '')}</b></div>
        ${plan !== 'lifetime' ? `<div class="row"><span>Ends</span><span class="mu">${dateOf(me.planUntil)}</span></div>` : ''}` : ''}
      ${plan === 'free' ? `<div class="row"><span>Free plan</span><span class="mu">Top ${SITE ? SITE.free_tokens : 4} tokens · ${SITE ? SITE.free_wallets : 10} wallets</span></div>` : ''}</div>`
      + (plan === 'lifetime' || (plan === 'owner' && !(SITE && SITE.payments === '1')) ? '' : plans) + '<div id="rcpt"></div>' + legal
      + `<button class="bt bd wide" id="so" style="margin-top:14px">Sign out</button>`;
    $('#so').onclick = () => menu([['Sign out', async () => { try { await api('/api/auth/logout', { body: {} }); } catch (e) { } token = ''; me = null; localStorage.removeItem(TK); toast('Signed out'); go('feed'); }, true]]);
  }
  $('#app').querySelectorAll('[data-l]').forEach(r => r.onclick = () => legalSheet(r.dataset.l));
  if (payOn) {
    $('#app').querySelectorAll('[data-p]').forEach(r => r.onclick = () => { buzz(5); PAYSEL = r.dataset.p; Account(); });
    $('#pay').onclick = () => me ? paySheet(PAYSEL) : signInSheet('Sign in first so the plan goes to your account.');
  }
  if (me) receipts();
}
async function receipts() {
  let j; try { j = await api('/api/pay/mine'); } catch (e) { return; }
  const el = $('#rcpt'); if (!el || tab !== 'account' || !j.payments.length) return;
  el.innerHTML = `<div class="sec">Payments</div><div class="cd" style="padding:2px 16px">${j.payments.map(p => `<div class="row"><div style="min-width:0;flex:1"><div>${esc(PLAN[p.plan] || p.plan)}</div>
    <div class="mu">${dateOf(p.paidAt || p.created)}${p.status === 'review' ? ' · being refunded' : p.status === 'refunded' ? ' · refunded' : ''}</div></div>
    <div class="tr"><b>${p.status === 'paid' ? p.sol : p.got} SOL</b>${p.sig ? `<div><a class="mu" href="https://solscan.io/tx/${esc(p.sig)}" target="_blank" rel="noopener">Receipt</a></div>` : ''}</div></div>`).join('')}</div>`;
}
function legalSheet(k) {
  const T = {
    terms: ['Terms', 'Scan Holders shows public Solana blockchain activity of wallets we track. Data can be late, missing or wrong. Plans are paid in SOL, give access for the time bought and are not refundable once the time has started. We can block accounts that abuse the service. Using the site means you accept these terms.'],
    privacy: ['Privacy', 'We store your wallet address or Google email, your plan and the wallets you add. We count page visits without cookies, using an ID that changes every day. We never ask for your seed phrase or private key, and we never sell your data.'],
    risk: ['Not financial advice', 'Nothing here tells you to buy or sell. KOL and smart wallets lose money too, and some sell into their own buyers. Meme coins can go to zero in minutes. Only use money you can afford to lose, and check every token yourself.']
  }[k];
  sheet(`<h3>${T[0]}</h3><p style="color:var(--tx2);margin:0 0 8px">${T[1]}</p><button class="bt wide mt" onclick="closeSheet()">Close</button>`);
}

// ---------- start ----------
(async function start() {
  const payref = new URLSearchParams(location.search).get('payref');
  if (payref) return PayScreen(payref);
  const siteP = api('/api/site').then(j => { SITE = j.site; }).catch(e => { if (e.message === 'down') throw e; });
  const meP = token ? api('/api/me').then(j => { me = j.user; }).catch(() => { }) : Promise.resolve();
  try { await Promise.all([siteP, meP]); } catch (e) { return; }
  if (SITE && SITE.site_live !== '1' && !(me && me.isAdmin)) return downScreen();
  const h = location.hash.slice(1);
  if (!me && !localStorage.getItem(SEEN) && !h) return Welcome();
  go(h || 'feed');
  if (pend().length) checkPendingQuiet();
})();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== tab && TABS.some(x => x[0] === h)) go(h); });
</script>
