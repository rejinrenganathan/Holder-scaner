# Deploys the Holder Scan server (server/worker.js) to Cloudflare whenever it changes on main.
# Needs 3 repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – token from Cloudflare (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID – Account ID shown on the Cloudflare Workers overview page
#   D1_DATABASE_ID        – optional: Database ID of holderscan-users. If missing, it is looked up with the token.
name: Deploy server
on:
  push:
    branches: [main]
    paths: ['server/worker.js', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are there
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLAUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLAUDFLARE_ACCOUNT_ID }}
          D: ${{ secrets.D1_DATABASE_ID }}
        run: |
          [ -n "$T" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [ -n "$A" ] || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Find the database ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLAUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLAUDFLARE_ACCOUNT_ID }}
          D: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$D" ]; then
            D=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=holderscan-users" \
              | jq -r '[.result[]? | select(.name=="holderscan-users") | .uuid][0] // empty')
          fi
          [ -n "$D" ] || { echo "::error::Could not find the holderscan-users database — check the token has D1 Edit and the account ID is right"; exit 1; }
          echo "Database found: ${D:0:8}…"
          echo "D1_ID=$D" >> "$GITHUB_ENV"
      - name: Write the Cloudflare config
        env:
          D: ${{ env.D1_ID }}
        run: |
          mkdir -p deploy && cp server/worker.js deploy/worker.js
          cat > deploy/wrangler.toml <<TOML
          name = "holder-scan-api"
          main = "worker.js"
          compatibility_date = "2025-01-01"
          workers_dev = true

          # re-checks plan payments people made and then closed the app
          [triggers]
          crons = ["*/5 * * * *"]

          [[d1_databases]]
          binding = "DB"
          database_name = "holderscan-users"
          database_id = "$D"
          TOML
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLAUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLAUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy
          command: deploy
