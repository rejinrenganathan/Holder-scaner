<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Holder Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#090b10;--bg2:#10131a;--card:#141822;--line:#212634;--line2:#2d3344;--txt:#eef1f7;--txt2:#c9d1de;--mut:#8590a6;--good:#22c55e;--bad:#f43f5e;--warn:#f59e0b;--acc:#7c9cff;--smart:#a78bfa;--gold:#fbbf24;
 --chip:#1c2130;--chip2:#262c3d;--press:#1a1f2b;--glass:rgba(9,11,16,.92);--skel1:#131722;--skel2:#1c2130;--kav:var(--kav);--inv:#f3f5f9;--invtxt:#0b0d12;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.25);--accbg:rgba(124,156,255,.14)}
[data-theme=light]{--bg:#f4f6fb;--bg2:#ffffff;--card:#ffffff;--line:#e3e7f0;--line2:#d3d9e6;--txt:#0f172a;--txt2:#334155;--mut:#64748b;--good:#16a34a;--bad:#e11d48;--warn:#d97706;--acc:#4f6bed;--smart:#7c3aed;--gold:#b45309;
 --chip:#eef1f7;--chip2:#e4e8f1;--press:#f0f3f9;--glass:rgba(255,255,255,.92);--skel1:#eef1f7;--skel2:#e3e7f0;--kav:#efe7ff;--inv:#0f172a;--invtxt:#ffffff;--shadow:0 1px 2px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.06);--accbg:rgba(79,107,237,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.hide{display:none!important}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 8px) 12px 0;border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:8px}
.hdr .logo{font-weight:800;font-size:17px;letter-spacing:-.01em}
.hdr .logo span{color:var(--smart)}
.hdr .sp{flex:1}
.live{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.live.on i{background:var(--good);box-shadow:0 0 6px var(--good)}
.live.busy i{background:var(--warn);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
.ib{background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:16px}
.instBtn{background:var(--smart);color:#140a24;border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:12px}
.tabs{display:flex;margin-top:10px}
.tabs button{flex:1;background:none;border:0;padding:10px 0 11px;color:var(--mut);font-weight:600;font-size:14px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--txt);border-color:var(--acc)}
.tabs button{font-size:12.5px;white-space:nowrap;padding-left:2px;padding-right:2px}
.tabs button b{font-size:11px;color:var(--mut);font-weight:600;margin-left:3px}
/* controls */
.ctl{padding:10px 12px 4px}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.presets::-webkit-scrollbar{display:none}
.pr{flex:0 0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px;color:var(--mut);white-space:nowrap}
.tf{padding:5px 10px;font-size:12px;border-radius:8px}
.pr.on{border-color:var(--acc);color:var(--txt);background:var(--accbg)}
.bar2{display:flex;gap:6px;align-items:center;margin-top:4px}
.bar2 select{width:auto;padding:7px 8px;font-size:13px;background:var(--bg2)}
.fbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.fbtn .n{background:var(--acc);color:#05121f;border-radius:10px;padding:0 6px;font-size:11px;font-weight:700}
.cnt{margin-left:auto;font-size:12px;color:var(--mut)}
/* list + cards */
.list{padding:6px 10px calc(env(safe-area-inset-bottom) + 30px)}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px 9px;margin-bottom:8px;position:relative;overflow:hidden}
.tc:active{background:var(--press)}
.r1{display:flex;gap:10px;align-items:center}
.av{position:relative;flex:0 0 46px;height:46px}
.av img,.av .ini{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--txt2)}
.av .lp{position:absolute;right:-4px;bottom:-4px;font-size:9px;font-weight:800;padding:1px 4px;border-radius:6px;border:2px solid var(--card);color:#0b0d10}
.lp-pump{background:#5ee08f}.lp-bonk{background:#ff9f43}.lp-bags{background:#7ed6ff}.lp-launchlab{background:#c39bff}.lp-dbc{background:#9fb4c7}.lp-other{background:#7d8896}
.mid{flex:1;min-width:0}
.nm{display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.nm b{font-size:15px}
.nm .full{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--mut)}
.age{color:var(--good);font-weight:600}
.xb{color:var(--mut);text-decoration:none;font-weight:800;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 5px}.xb.on{color:var(--txt);border-color:var(--line2)}
.cp{background:none;border:0;color:var(--mut);padding:0 2px;font-size:13px}
.rt{text-align:right;flex:0 0 auto}
.mc{font-size:12px;color:var(--mut)}.mc b{color:var(--txt);font-size:15px}
.chg{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--good)}.dn{color:var(--bad)}
.r2{display:flex;gap:12px;margin-top:9px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.r2 b{color:var(--txt);font-weight:600}
.r3{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.bd{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;background:var(--chip);color:var(--mut)}
.bd.sm{background:rgba(176,124,255,.15);color:var(--smart)}
.bd.sp{background:rgba(255,209,102,.13);color:var(--gold)}
.bd.ok{background:rgba(46,204,113,.12);color:var(--good)}
.bd.bad{background:rgba(255,77,94,.13);color:var(--bad)}
.bd.wn{background:rgba(245,166,35,.13);color:var(--warn)}
.bs{display:flex;height:3px;border-radius:3px;overflow:hidden;margin-top:9px;background:var(--bad)}
.bs i{background:var(--good)}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
.skel{height:108px;border-radius:14px;background:linear-gradient(90deg,var(--skel1),var(--skel2),var(--skel1));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg2);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:8px 14px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:17px}
.fl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px;color:var(--mut)}
.chipsel button.on{border-color:var(--acc);color:var(--txt);background:var(--accbg)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw input{width:auto;transform:scale(1.3)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;background:var(--acc);color:#05121f;margin-top:14px}
.btn.gh{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.pu{background:var(--smart);color:#140a24}
.note{font-size:12px;color:var(--mut)}
.kt{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.kav{flex:0 0 36px;width:36px;min-width:36px;max-width:36px;height:36px;border-radius:50%;background:var(--kav);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:13px}
.side{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin:0 4px}
.side.buy{background:rgba(46,204,113,.15);color:var(--good)}.side.sell{background:rgba(255,77,94,.15);color:var(--bad)}
.ktok{display:flex;align-items:center;gap:7px;text-align:right}
.ktok img,.ktok .ini{width:30px;height:30px;min-width:30px;max-width:30px;flex:0 0 30px;border-radius:8px;object-fit:cover;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:800}
.kbar{display:flex;gap:6px;align-items:center;margin:6px 0 4px}
.kbar .seg2{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:2px}
.kbar .seg2 button{background:none;border:0;padding:6px 12px;border-radius:8px;color:var(--mut);font-size:13px;font-weight:600}
.kbar .seg2 button.on{background:var(--chip2);color:var(--txt)}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rst{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:600}
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 10px;border-bottom:1px solid var(--line)}
.ftabs::-webkit-scrollbar{display:none}
.ft{flex:0 0 auto;background:var(--card);border:0;border-radius:20px;padding:8px 14px;color:var(--mut);font-size:13px;font-weight:600}
.ft.on{background:var(--chip2);color:var(--txt)}
.fbody{padding:8px 0 90px}
.rr{margin-top:14px}.rl{font-size:14px;font-weight:600;margin-bottom:7px}
.hm-tag{font-size:10px;color:var(--smart);font-weight:600;margin-left:4px}
.rg{display:flex;align-items:center;gap:6px}.dash{color:var(--mut)}
.ri{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.ri input::-webkit-outer-spin-button,.ri input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.ri input{-moz-appearance:textfield;border:0;background:none;padding:11px 0;min-width:0}.ri em{font-style:normal;color:var(--mut);font-size:13px;margin-left:4px}
.fbar{position:sticky;bottom:calc(-1 * env(safe-area-inset-bottom) - 16px);display:flex;gap:10px;background:var(--bg2);padding:10px 0 calc(env(safe-area-inset-bottom) + 12px);margin:0 -2px}
.fbar .btn{margin:0}.btn.wh{background:var(--inv);color:var(--invtxt)}
.rowh{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.ck2{display:flex;gap:8px;align-items:center;color:var(--txt);font-size:14px}.ck2 input{width:auto}
.lpg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lpb{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 12px;color:var(--mut);font-size:13px;text-align:left}
.lpb.on{border-color:var(--good);color:var(--good);background:rgba(46,204,113,.08)}
.lpb .lp{font-size:9px;font-weight:800;padding:2px 4px;border-radius:5px;color:#0b0d10}
/* detail page */
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
.ph{position:sticky;top:0;background:var(--glass);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;border-bottom:1px solid var(--line);z-index:2}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px}
.sec h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{background:var(--bg);border-radius:10px;padding:8px}
.st span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.st b{font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{flex:1;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 6px;color:var(--txt);text-decoration:none;font-size:13px;font-weight:600}
.ck{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.ck:last-child{border:0}
.dt{flex:0 0 9px;height:9px;border-radius:50%;margin-top:4px}
.d-pass{background:var(--good)}.d-warn{background:var(--warn)}.d-fail{background:var(--bad)}.d-info{background:var(--mut)}
.hd{background:var(--bg);border-radius:10px;padding:9px;margin-bottom:6px}
.hd .t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hd a{color:var(--acc);text-decoration:none;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:11px;color:var(--mut)}
.hm b{display:block;color:var(--txt);font-size:13px}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--mut)}
.star.on{color:var(--gold);border-color:var(--gold)}
.verdict{font-size:20px;font-weight:800;margin:2px 0 8px}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--smart);width:0;transition:width .3s}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--chip2);border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13px;z-index:60;transition:opacity .3s}
.wl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.wl button{background:none;border:0;color:var(--bad)}
.setup{padding:calc(env(safe-area-inset-top) + 40px) 18px 20px;max-width:480px;margin:auto}
.setup h1{font-size:26px;margin:16px 0 6px}
.setup img{width:64px;height:64px;border-radius:16px}

/* ---- polish ---- */
html{transition:background .2s}
.tc,.kt,.sec{box-shadow:var(--shadow)}
.tc{border-radius:16px;padding:12px 13px 10px}
.tc:active,.kt:active{transform:scale(.995);background:var(--press)}
.ib{border-radius:12px;transition:background .15s}.ib:active{background:var(--chip2)}
.btn{border-radius:14px;transition:transform .1s,filter .15s}.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn{background:linear-gradient(135deg,var(--acc),#9b7cff);color:#fff}
.btn.gh{background:var(--card);color:var(--txt)}
.pr,.fbtn,.ft,.chipsel button,.lpb{transition:all .15s}
.pr.on{box-shadow:0 0 0 1px var(--acc) inset}
.av img,.av .ini{border-radius:14px}
.av .lp{display:flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 3px;border-radius:7px;right:-5px;bottom:-5px;overflow:hidden;border:2px solid var(--card)}
.av .lp.im:has(img){background:var(--card);padding:0}
.av .lp img{width:16px;height:16px;border-radius:4px;object-fit:contain;background:none}
.solt{font-size:9px;font-weight:800;background:var(--chip2);border-radius:4px;padding:0 3px;margin-right:2px;vertical-align:1px}
.solx{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:2px;border-radius:50%;object-fit:cover}
.logo{display:flex;align-items:center;gap:7px}.logo img{width:22px;height:22px;border-radius:6px}
.r3 .bd{border-radius:8px}
.bs{height:4px}
.kav{overflow:hidden}.kav img,.wav img,.kpav img{width:100%!important;height:100%!important;max-width:100%;object-fit:cover;display:block;border-radius:50%}
.kt>span[data-kw],.wl-l>span[data-kw],.r1>span[data-kw]{flex:0 0 auto;display:inline-flex;line-height:0}
.kt .mid{min-width:0;flex:1 1 auto;overflow:hidden}.kt .ktok{flex:0 0 auto;max-width:42%}
.kt .nm{flex-wrap:nowrap;align-items:center;gap:4px}.kt .nm .kn{min-width:0;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kt .nm>b:last-child{white-space:nowrap;flex:0 0 auto}.kt .side{flex:0 0 auto}.kt .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar{flex-wrap:wrap}
.kn{cursor:pointer}
.hrt{background:none;border:0;font-size:16px;line-height:1;color:var(--mut);padding:0 4px;margin-left:2px}.hrt.on{color:#f43f5e}
.tc.fav .kpav{width:44px;height:44px;min-width:44px;max-width:44px;flex:0 0 44px}
.kpr[data-hm]{cursor:pointer}
.wl.plain{font-family:inherit;font-size:13px;cursor:pointer}
.kph{display:flex;gap:12px;align-items:center}
.kpav{width:52px;height:52px;min-width:52px;max-width:52px;flex:0 0 52px;border-radius:50%;overflow:hidden;background:var(--kav);display:grid;place-items:center;font-weight:800;color:var(--gold)}.kpav img{width:100%;height:100%;object-fit:cover}
.pnlcard{background:linear-gradient(160deg,var(--card),var(--bg));border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.pnlcard .seg2{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.pnlcard .seg2 button{flex:1;background:none;border:0;padding:7px 0;border-radius:8px;color:var(--mut);font-size:13px;font-weight:700}
.pnlcard .seg2 button.on{background:var(--chip2);color:var(--txt)}
.pnlbig{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:2px 0}.pnlbig .solx{width:22px;height:22px;vertical-align:-3px}
.chbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chbar .seg2{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.chbar .seg2 button{background:none;border:0;padding:5px 9px;border-radius:8px;color:var(--mut);font-size:12px;font-weight:700}
.chbar .seg2 button.on{background:var(--chip2);color:var(--txt)}
.chbar .star{margin-left:auto}
.chart{height:300px;border-radius:10px;overflow:hidden;background:var(--bg)}
.dsframe{width:100%;height:100%;border:0}
.pch{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.pch.hold{background:rgba(34,197,94,.14);color:var(--good)}.pch.part{background:rgba(245,158,11,.14);color:var(--warn)}.pch.sold{background:rgba(244,63,94,.13);color:var(--bad)}
.kpl{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.kpr{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px}.kpr .wav{width:22px;height:22px;flex:0 0 22px;margin-right:2px}
.wav,.wl .wav{width:26px;height:26px;min-width:26px;max-width:26px;border-radius:50%;overflow:hidden;background:var(--kav);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--gold);margin-right:8px;flex:0 0 26px}
.wav img,.wl .wav img{width:100%;height:100%;object-fit:cover}
.wl .wl-l{display:flex;align-items:center;min-width:0;flex:1}
.stt{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px}
.stt.on{background:rgba(34,197,94,.14);color:var(--good)}.stt.off{background:var(--chip);color:var(--mut)}
/* ===== token page v2 ===== */
#vDetail{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.dh{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 9px;border-bottom:1px solid var(--line)}

function throttle(getRps){let next=0;return async()=>{const gap=1000/getRps(),now=Date.now(),w=Math.max(0,next-now);next=Math.max(now,next)+gap;if(w)await sleep(w);};}
// request pacer with a fast lane: live trades (.hi) jump ahead of background checks
function pthrottle(getRps){const qh=[],ql=[];let next=0,tm=null;
  const go=()=>{tm=null;const r=qh.shift()||ql.shift();if(!r)return;next=Math.max(Date.now(),next)+1000/getRps();r();if(qh.length||ql.length)tm=setTimeout(go,Math.max(0,next-Date.now()));};
  const pump=()=>{if(!tm)tm=setTimeout(go,Math.max(0,next-Date.now()));};
  const f=()=>new Promise(r=>{ql.push(r);pump();});f.hi=()=>new Promise(r=>{qh.push(r);pump();});return f;}
const TH={r2:throttle(()=>5),bg:throttle(()=>LIMITS[PLAN].bg),rpc:pthrottle(()=>{let sub=false;try{sub=LIVE.subbing>0;}catch(e){}return LIMITS[PLAN].rpc*(sub?0.5:1);}),enh:throttle(()=>LIMITS[PLAN].enh),ds:throttle(()=>4),gt:throttle(()=>0.45)};
async function getJSON(url,opts,th){
  for(let i=0;i<4;i++){
    await (th||TH.ds)();let r;
    try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);try{r=await fetch(url,{...(opts||{}),signal:ac.signal});}finally{clearTimeout(tm);}}catch(e){if(i===3)throw new Error('Network error');await sleep(700);continue;}
    if(r.status===429){await sleep(1200*(i+1));continue;}
    if(r.status===401||r.status===403)throw new Error('Helius rejected the API key');
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }
  throw new Error('Rate limited');
}
// ---- RPC load balancing: Helius + your extra free RPCs (one account each at Alchemy / QuickNode / Chainstack / dRPC …) ----
// Standard Solana calls are spread over the extra RPCs first; Helius is kept for what only Helius has (transaction history, token metadata).
// An extra RPC that keeps failing is rested for 2 minutes; if all fail, the call goes to Helius.
if(SET.rpc2&&!SET.rpcs){SET.rpcs=[SET.rpc2];delete SET.rpc2;store.set('hs_set',SET);}
let XR=[];function buildXR(){XR=(SET.rpcs||[]).filter(u=>/^https:\/\//.test(u)).slice(0,6).map(u=>({u,th:throttle(()=>8),fail:0,until:0,ok:0,q:0}));}
buildXR();

const XRPS=8;
async function xone(x,method,params){
  x.q=(x.q||0)+1;
  try{const j=await getJSON(x.u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})},x.th);
    if(j&&!j.error){x.fail=0;x.ok++;return{ok:true,r:j.result};}
    x.lastErr=String(j?.error?.message||'error').slice(0,60);}
  catch(e){x.lastErr=e.message.replace('Helius rejected the API key','key rejected');if(/API key/.test(e.message)){x.until=Date.now()+30*60e3;return{ok:false};}}
  finally{x.q--;}

    const people=hs.filter((h,i)=>{const o=oi?.value?.[i];return!(BURN.has(h.owner)||POOL_AUTH.has(h.owner)||h.owner===t.pair?.pairAddress||(o&&o.owner!==SYSTEM)||!o);});

    if(!o.card)try{const tx=await txRecent(t.mint,100);const trades=(Array.isArray(tx)?tx:[]).filter(x=>!x.transactionError&&(x.tokenTransfers||[]).some(y=>y.mint===t.mint));
      if(trades.length>=5){const tot=trades.reduce((a,x)=>a+(x.fee||0)+(x.nativeTransfers||[]).filter(n=>JITO.has(n.toUserAccount)).reduce((b,n)=>b+(n.amount||0),0),0);
        t.feeAvg=tot/trades.length/1e9;t.fees24=t.feeAvg*(t.buys.h24+t.sells.h24);}}catch(e){}

    try{let n=0,page=1,more=true;while(more&&page<=5){const r=await das('getTokenAccounts',{mint:t.mint,page,limit:1000});const ac=r?.token_accounts||[];n+=ac.filter(a=>+a.amount>0).length;more=ac.length===1000;page++;}holders={n,more};}catch(e){}

    t.hmAt=Date.now();t.top10=t.hm.top10;t.hmFail=0;
  }catch(e){}

}

  const im=Object.keys(ins),om=Object.keys(outs);
  const ad=(tx.accountData||[]).find(a=>a.account===w);let sol=(ad?ad.nativeBalanceChange:0)/1e9;
  for(const x of tt){if(x.mint!==WSOL)continue;if(x.toUserAccount===w)sol+=+x.tokenAmount||0;if(x.fromUserAccount===w)sol-=+x.tokenAmount||0;}

// ================= fast wallet tracker engine =================
// 1) cheap check: newest signatures of each wallet (standard RPC → spread over your extra RPCs, then Helius)
// 2) only NEW signatures are parsed, up to 100 per Helius call (POST /v0/transactions) → far fewer Helius calls than before
let LASTSIG=store.get('hs_lastsig',{}),trCur=store.get('hs_trcur',0),tracking=false,PENDSIG=[],trackTimer=null,lastTrack=0,parseFails=0;

const TRACK_MODES={saver:{ms:45e3,b:25},normal:{ms:20e3,b:45},fast:{ms:10e3,b:80}};
const trackMode=()=>TRACK_MODES[SET.track]||TRACK_MODES.normal;

const lastOf=w=>KOL[w]?(KACT[w]?.last||0):(SMART[w]?.last||0);
function trackList(kind){
  const now=Date.now()/1000,k=kind==='smart'?[]:Object.keys(KOL).filter(kolOK);
  const s=kind==='kol'?[]:Object.keys(SMART).filter(w=>!KOL[w]&&(!SMART[w].last||now-SMART[w].last<ACTIVE_DAYS*86400));
  return[...k,...s];

async function parseSigs(ch,owner,onAdd){
  let added=0;const add=tx=>{const w=owner[tx.signature];if(!w)return;if(KOL[w]?addTrade(tx,w):SMART[w]?addSTrade(tx,w):false)added++;};
  try{if(parseFails>=2)throw new Error('skip');
    const d=await enhPost('/v0/transactions/?api-key='+encodeURIComponent(KEY),{transactions:ch.map(x=>x[0])});
    if(!Array.isArray(d))throw new Error('bad reply');d.forEach(add);parseFails=0;}
  catch(e){

    if(e.message!=='skip')parseFails++;else if(Math.random()<0.1)parseFails=1;
    const wsN=[...new Set(ch.map(x=>x[1]))];
    await pool(wsN,LIMITS[PLAN].par+1,async w=>{try{const txs=await txRecent(w,20);(Array.isArray(txs)?txs:[]).forEach(tx=>{if(KOL[w]?addTrade(tx,w):SMART[w]?addSTrade(tx,w):false)added++;});}
      catch(e2){TRK.err='Helius: '+e2.message;PENDSIG.push(...ch.filter(x=>x[1]===w).slice(0,50));}});}

const PRIO=new Set();     // wallets to check first in the next round (just added)
async function trackPoll(opt){
  opt=opt||{};
  if(!KEY)return 0;
  // just-added wallets get their own small round right away, even while a big round is running
  const quick=!!opt.list;if(quick)opt.list.forEach(w=>PRIO.add(w));
  if(!quick){if(tracking)return 0;tracking=true;}let added=0;
  try{
    const ws=trackList(opt.kind);if(!ws.length)return 0;
    // first time (or after adding many wallets): check every wallet once so the feed fills right away
    const unseen=ws.filter(w=>LASTSIG[w]===undefined);
    if(!opt.all&&!opt.list&&unseen.length>ws.length*0.3){opt={...opt,all:true,first:true};}
    let batch;
    if(opt.list){batch=[...PRIO].filter(w=>KOL[w]||SMART[w]);PRIO.clear();}
    else if(opt.all)batch=(opt.first?[...unseen,...ws.filter(w=>LASTSIG[w]!==undefined).slice(0,40)]:[...ws]).sort((a,b)=>(FAV.has(b)-FAV.has(a))||(lastOf(b)-lastOf(a)));
    else{const budget=Math.round(trackMode().b*(1+xLive().length*0.8));
      const hot=[...new Set([...[...FAV].filter(w=>ws.includes(w)),...[...ws].sort((a,b)=>lastOf(b)-lastOf(a)).slice(0,Math.ceil(budget/2))])].slice(0,budget);
      const hs=new Set(hot),rest=ws.filter(w=>!hs.has(w)),rot=[];
      for(let i=0;i<Math.max(0,budget-hot.length)&&i<rest.length;i++)rot.push(rest[(trCur+i)%rest.length]);
      trCur=rest.length?(trCur+rot.length)%rest.length:0;store.set('hs_trcur',trCur);batch=[...hot,...rot];}
    if(!opt.list&&PRIO.size){const pr=[...PRIO].filter(w=>KOL[w]||SMART[w]);PRIO.clear();batch=[...new Set([...pr,...batch])];}
    const need=[...PENDSIG];PENDSIG=[];const owner={};need.forEach(([s,w])=>owner[s]=w);let done=0,ok=0,pi=0,flushing=null,lastFlush=Date.now();
    // parse new signatures in batches while the scan is still running, so trades show up right away
    const flush=async(all)=>{
      while(need.length-pi>=(all?1:40)||(need.length>pi&&(all||Date.now()-lastFlush>4000))){
        const ch=need.slice(pi,pi+100);pi+=ch.length;lastFlush=Date.now();
        const before=added;await parseSigs(ch,owner,n=>added+=n);
        if(added>before){[...KTR,...STR].forEach(x=>{const t=tok(x.m);t.seen=Date.now();});saveKTR();saveSTR();loadMarket(true).then(()=>{renderSoft();loadImages();loadCurves(true);});renderSoft();}
        if(!all)break;}};
    if(!quick)Object.assign(TRK,{total:ws.length,first:!!opt.first,prog:'',err:''});
    await pool(batch,TRACK_PAR(),async w=>{
      try{const r=await rpc('getSignaturesForAddress',[w,{limit:15}]);if(Array.isArray(r))ok++;
        if(Array.isArray(r)&&r.length){const prev=LASTSIG[w];/*tracker*/LASTSIG[w]=r[0].signature;const bt=r[0].blockTime||0;
          if(KOL[w])KACT[w]={t:Date.now(),last:Math.max(KACT[w]?.last||0,bt)};else if(SMART[w]){SMART[w].last=Math.max(SMART[w].last||0,bt);SMART[w].la=Date.now();}
          let fresh=[];for(const s of r){if(s.signature===prev)break;if(!s.err)fresh.push(s);}
          if(prev===undefined)fresh=fresh.filter(s=>Date.now()/1000-(s.blockTime||0)<KEEP_S).slice(0,8);   // first look at a wallet: last 48h only
          fresh.forEach(s=>{if(!owner[s.signature]){owner[s.signature]=w;need.push([s.signature,w]);}});}
        else if(Array.isArray(r)){LASTSIG[w]=LASTSIG[w]||'';if(KOL[w])KACT[w]={t:Date.now(),last:KACT[w]?.last||0};}}catch(e){TRK.err=e.message;}
      done++;opt.onStep&&opt.onStep(done,batch.length);
      if(!flushing&&(need.length-pi>=40||(need.length>pi&&Date.now()-lastFlush>4000))){flushing=flush(false).finally(()=>flushing=null);}
      if(batch.length>60&&(done%25===0||done===batch.length)){TRK.prog=`${opt.first?'First pass':'Checking'} ${done}/${batch.length} wallets`;showTrk();}},()=>opt.stop?.()||(!opt.user&&!$('vDetail').classList.contains('hide')));   // background rounds pause while a token page is open
    if(flushing)await flushing;await flush(true);

    const ks=Object.keys(LASTSIG);if(ks.length>4000)ks.slice(0,ks.length-3000).forEach(k=>delete LASTSIG[k]);
    store.set('hs_lastsig',LASTSIG);store.set('hs_kact',KACT);saveKTR();saveSTR();saveSmart();
    if(added){[...KTR,...STR].forEach(x=>{const t=tok(x.m);t.seen=Date.now();});await loadMarket(true);loadImages();loadCurves(true);}
    if(!quick){lastTrack=Date.now();Object.assign(TRK,{t:Date.now(),checked:done,added,prog:''});}else TRK.added+=added;
    if(!ok&&done)TRK.err=TRK.err||'No RPC answered — check your Helius key / extra RPCs in Settings';
  }finally{if(!quick)tracking=false;showTrk();}
  if(added)renderSoft();
  return added;
}

// ================= ⚡ Live stream: one WebSocket subscription per wallet (logsSubscribe) =================
// Every tracked wallet is watched in real time instead of being polled, so 2,000+ wallets cost almost no credits.
// A new signature is read with getTransaction (1 credit) and parsed here — no 100-credit batch parse needed.
const LIVE={subbing:0,on:false,conns:[],subs:0,want:0,ev:0,trades:0,err:'',t:0};
const WS_PER_CONN=500,WS_MAX_CONN=6;
const liveList=()=>[...Object.keys(KOL),...Object.keys(SMART).filter(w=>!KOL[w])];   // live watching is cheap: every saved wallet, active or not
function wsUrls(){return ['wss://mainnet.helius-rpc.com/?api-key='+encodeURIComponent(KEY)];}   // Alchemy & co. don't support logsSubscribe on Solana
function liveStop(){LIVE.conns.forEach(c=>{c.dead=true;try{c.ws.close();}catch(e){}});LIVE.conns=[];LIVE.subs=0;LIVE.on=false;}
function liveStart(){
  liveStop();if(!KEY||SET.live===false||hookOn())return;
  const ws=liveList();LIVE.want=ws.length;LIVE.on=true;LIVE.err='';if(!ws.length)return;
  const P=perConn(),urls=wsUrls(),n=Math.min(WS_MAX_CONN,Math.max(1,Math.ceil(ws.length/P)));
  // favorites and the most active wallets get the live slots first
  ws.sort((a,b)=>(FAV.has(b)-FAV.has(a))||(lastOf(b)-lastOf(a)));
  for(let i=0;i<n;i++){const part=ws.slice(i*P,(i+1)*P);if(part.length)liveConn(urls[i%urls.length],part,i);}
  if(ws.length>n*P)LIVE.err=`${ws.length-n*P} less active wallets are checked by polling (live limit ${n*P})`;
}
// one pace per provider for all its connections; while Helius subscriptions run, the tracker's own Helius pace is halved so both stay under the free 10 req/s
const SUBP={};const subPace=url=>{const h=new URL(url.replace(/^wss:/,'https:')).hostname;return SUBP[h]||(SUBP[h]=throttle(()=>/helius/.test(h)?(PLAN==='paid'?20:4):15));};
let WS_CAP=0,CAP_SEEN=[];try{localStorage.removeItem('hs_wscap');}catch(e){}const perConn=()=>Math.min(WS_PER_CONN,WS_CAP||WS_PER_CONN);
function liveConn(url,wallets,idx){
  const c={url,wallets,ws:null,byId:{},bySub:{},subs:0,dead:false,tries:(LIVE.conns[idx]?.tries)||0};LIVE.conns[idx]=c;
  let ws;try{ws=new WebSocket(url);}catch(e){LIVE.err='WebSocket blocked';return;}c.ws=ws;
  ws.onopen=async()=>{c.openAt=Date.now();let id=1;
    // subscribe gently: one shared pace per provider (free Helius ≈ 10 requests/s), however many connections are open
    const th=subPace(url);
    LIVE.subbing++;try{for(const w of [...wallets]){if(c.dead||ws.readyState!==1)return;await th();if(c.dead||ws.readyState!==1)return;const i=id++;c.byId[i]=w;
      ws.send(JSON.stringify({jsonrpc:'2.0',id:i,method:'logsSubscribe',params:[{mentions:[w]},{commitment:'confirmed'}]}));}}finally{LIVE.subbing--;}

function qualFail(q,e,bal,age){

  if(q.minAge&&age&&age.days!=null&&age.days<q.minAge)r.push(`wallet ${num(age.days,1)}d old`);
  if(!e)return r.length?r:['stats not checked'];

  if(q.minClosed!=null&&e.closed<q.minClosed)r.push(`${e.closed} closed trades`);

// walk any JSON and collect wallet objects, remembering which leaderboard list (category) they came from
function collectWallets(j){

    const w=n.wallet_address||n.address||n.wallet;
    if(typeof w==='string'&&B58.test(w)&&['winrate_7d','realized_profit_7d','last_active','name','twitter_username','twitter','profit','wins'].some(k=>n[k]!=null)){
      const o=out[w]||(out[w]={w,cats:new Set(),tags:new Set(),raw:{}});if(cat)o.cats.add(cat);(Array.isArray(n.tags)?n.tags:[]).forEach(t=>o.tags.add(String(t)));Object.assign(o.raw,n);return;}

// wallet age from its signature history; pages back up to 3,000 signatures (3,000+ txs younger than the limit = bot-like)
async function walletAgeDeep(w,minDays){

const TF_MIN={m5:5,m15:15,m30:30,h1:60,h2:120,h4:240,h6:360,h8:480,h12:720,h24:1440};
let SMTC={k:''};
function smtIndex(tf){
  const win=(TF_MIN[tf]||60)*60,now=Date.now()/1000,key=tf+'|'+KTR.length+'|'+STR.length+'|'+Math.floor(now/30);
  if(SMTC.k===key)return SMTC.m;
  const m=new Map(),g=x=>m.get(x.m)||(m.set(x.m,{k:new Set(),s:new Set(),sell:new Set(),bin:0,sout:0,last:0}),m.get(x.m));
  KTR.forEach(x=>{if(now-x.ts>win||!KOL[x.w]||!kolOK(x.w))return;const o=g(x);if(x.side==='buy'){o.k.add(x.w);o.bin+=x.sol;}else{o.sell.add(x.w);o.sout+=x.sol;}o.last=Math.max(o.last,x.ts);});
  STR.forEach(x=>{if(now-x.ts>win||KOL[x.w]||!SMART[x.w]||!swOK(x.w))return;const o=g(x);if(x.side==='buy'){o.s.add(x.w);o.bin+=x.sol;}else{o.sell.add(x.w);o.sout+=x.sol;}o.last=Math.max(o.last,x.ts);});
  // a wallet that bought and then sold inside the window counts as a seller, not a buyer
  m.forEach(o=>{o.sell.forEach(w=>{o.k.delete(w);o.s.delete(w);});});

const KHIST={};                                  // wallet -> {txs, before, complete}
async function kolHistory(w,pages){
  const h=KHIST[w]||(KHIST[w]={txs:[],before:null,complete:false,seen:new Set()});
  for(let i=0;i<pages&&!h.complete;i++){
    const d=await enhGet('/v0/addresses/'+w+'/transactions?api-key='+encodeURIComponent(KEY)+'&limit=100'+(h.before?'&before='+h.before:''));
    if(!Array.isArray(d)||!d.length){h.complete=true;break;}
    d.forEach(tx=>{const k=tx.signature||(tx.timestamp+':'+tx.slot+':'+h.txs.length);if(!h.seen.has(k)){h.seen.add(k);h.txs.push(tx);}});
    h.before=d[d.length-1].signature;if(d.length<100)h.complete=true;
  }
  return h;
}

function pnlCalc(w,txs){
  const asc=[...txs].sort((a,b)=>a.timestamp-b.timestamp),pos={},ev=[],trades=[];PARSED[w]=trades;
  for(const tx of asc){const tr=parseTrade(tx,w);if(!tr)continue;trades.push({...tr,ts:tx.timestamp,s:tx.signature});
    const p=pos[tr.m]||(pos[tr.m]={q:0,c:0,first:null});
    if(tr.side==='buy'){p.q+=tr.amt||0;p.c+=tr.sol;if(p.first==null)p.first=tx.timestamp;}
    else if(p.q>0&&tr.amt){const frac=Math.min(1,tr.amt/p.q),cost=p.c*frac;p.q=Math.max(0,p.q-tr.amt);p.c-=cost;ev.push({ts:tx.timestamp,m:tr.m,pnl:tr.sol-cost,cost,proceeds:tr.sol,hold:tx.timestamp-p.first});if(p.q<=0)p.first=null;}
    else ev.push({ts:tx.timestamp,m:tr.m,pnl:null,proceeds:tr.sol,unmatched:true});}

}
function pnlWindow(P,secs,complete){

    volIn:tr.filter(x=>x.side==='buy').reduce((a,x)=>a+x.sol,0),best,worst:worst&&worst[1]<0?worst:null,hold:ev.length?median(ev.map(e=>e.hold).filter(Boolean)):null,unmatched:P.ev.filter(e=>e.ts>=from&&e.unmatched).length,partial:!!(secs&&!complete&&P.oldest&&P.oldest>from)};
}

function passBase(t,f,now){

  if(s.x&&!hasX)return false;if(s.tg&&!hasTg)return false;if(s.web&&!hasWeb)return false;if(s.any&&!(hasX||hasTg||hasWeb))return false;
  const r=f.r||{},k=txKey(f.tf),b=t.buys[k]||0,se=t.sells[k]||0;
  if(!inR(t.created?(now-t.created)/60000:null,r.age))return false;
  if(rOn(r.grad)&&!inR(t.gradAt?(now-t.gradAt)/60000:null,r.grad))return false;
  if(!inR(t.mc/1000,r.mc))return false;
  if(rOn(r.liq)&&t.stage==='mig'&&!inR(t.liq/1000,r.liq))return false;
  if(!inR(t.act.sm.size,r.smart))return false;
  if(!inR(t.auth?t.auth.tax:null,r.tax))return false;
  if(!inR(kolCount(t),r.kols))return false;
  if(!inR(volTF(t,f.tf)/1000,r.vol))return false;
  if(!inR(b+se,r.txs))return false;
  if(!inR(b,r.buys))return false;
  if(!inR(se,r.sells))return false;
  if(!inR(b/(se+1),r.br))return false;
  if(!inR(chgTF(t,f.tf)[0],r.chg))return false;
  if(!inR(t.spike,r.spike))return false;
  if(!inR(t.bsp,r.bsp))return false;

}
function passHolder(t,f){
  const h=t.hm,r=f.r||{};if(!h)return false;
  if(!inR(h.top10,r.top10))return false;
  if(rOn(r.holders)){if(!h.holders)return false;const[mn,mx]=r.holders,n=h.holders.n;if(mn!=null&&!h.holders.more&&n<mn)return false;if(mx!=null&&(h.holders.more||n>mx))return false;}

function sortKey(f,tab){

    chg:t=>chgTF(t,f.tf)[0]??-1e9,smart:t=>t.act.sm.size*1e6+hotScore(t,f.tf),spike:t=>t.spike,
    bspike:t=>Math.min(t.bsp||0,12)*10+Math.min(t.spike||0,10)*3+Math.log10((t.vol.m5||0)+1),smt:t=>smtScore(smtIndex(f.tf).get(t.mint))*1e3+hotScore(t,f.tf),bond:t=>bondP(t)??-1}[f.sort]||(t=>hotScore(t,f.tf));

function tradeCmp(k){const nw=(p,q)=>q.ts-p.ts||(p.s<q.s?-1:1);

// keyed DOM update: cards are matched by key and only what changed inside them is touched
// (pictures stay loaded, nothing jumps, scroll stays put) — like GMGN / Axiom live lists
function morph(o,n){
  if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName){o.replaceWith(n);return;}
  if(o.nodeType===3){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;return;}
  if(o.nodeType!==1)return;
  // an <img> showing the same picture is left alone (its onerror fallback may have changed it — don't undo that)
  if(o.nodeName==='IMG'){const ns=n.getAttribute('src');if(o.__src===undefined)o.__src=o.getAttribute('src');if(o.__src!==ns){n.__src=ns;o.replaceWith(n);}return;}
  for(const at of [...o.attributes])if(!n.hasAttribute(at.name))o.removeAttribute(at.name);
  for(const at of [...n.attributes])if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
  const oc=[...o.childNodes],nc=[...n.childNodes],m=Math.min(oc.length,nc.length);
  for(let i=0;i<m;i++)morph(oc[i],nc[i]);
  for(let i=m;i<oc.length;i++)oc[i].remove();

function parseWalletLines(txt,mode){
  const out=[],seen=new Set();
  String(txt||'').split(/\r?\n/).forEach((line,i)=>{
    const L=line.trim();if(!L)return;
    const toks=L.split(/[\s,;|\t]+/).map(x=>x.replace(/^["'`“”]+|["'`“”]+$/g,'')).filter(Boolean);
    const addr=toks.find(x=>B58.test(x));
    if(!addr){if(!/^(wallet|address|addr|name|#)/i.test(L))out.push({line:i+1,raw:L.slice(0,40),err:'no valid wallet address'});return;}
    if(seen.has(addr)){out.push({line:i+1,w:addr,err:'same wallet twice'});return;}seen.add(addr);
    let handle=null;const rest=[];
    toks.forEach(x=>{if(x===addr)return;const m=x.match(/^(?:https?:\/\/)?(?:www\.)?(?:x|twitter)\.com\/@?([A-Za-z0-9_]{1,15})\/?$/i)||x.match(/^@([A-Za-z0-9_]{1,15})$/);
      if(m&&!handle)handle=m[1];else rest.push(x);});
    const name=rest.join(' ').replace(/^["'“”]+|["'“”]+$/g,'').trim().slice(0,40);
    const was=KOL[addr]?'kol':SMART[addr]?'smart':null,type=mode==='smart'?'smart':handle?'kol':'smart';
    // "Smart only" upload never touches a wallet you already saved as a KOL
    if(mode==='smart'&&was==='kol'){out.push({line:i+1,w:addr,err:'already a KOL — kept as KOL',keep:true});return;}
    out.push({line:i+1,w:addr,name,handle,type,was});
  });
  return out;
}
function saveWalletLines(rows){

  rows.filter(r=>!r.err).forEach(r=>{

    if(r.type==='kol'){KOL[r.w]=r.name||r.handle;KOLX[r.w]=r.handle;if(SMART[r.w])delete SMART[r.w];nk++;}
    else{if(KOL[r.w]){delete KOL[r.w];delete KOLX[r.w];}SMART[r.w]={...(SMART[r.w]||{t:Date.now()}),src:SMART[r.w]?.src||'manual',...(r.name?{n:r.name}:{}),...(r.handle?{x:r.handle}:{})};ns++;}

  return{nk,ns,moved,added};
}

function readAddHash(){
  const h=(location.hash||'')+'&'+(location.search||'').replace(/^\?/,'&');const m=h.match(/[#&?]add=([^&#]+)/);if(!m)return null;
  let arr=null;try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/');arr=JSON.parse(decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4)))));}catch(e){arr=null;}
  const as=(h.match(/[#&?]as=(\w+)/)||[])[1]==='smart'?'smart':'auto',from=decodeURIComponent((h.match(/[#&?]from=([^&#]+)/)||[])[1]||'');
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  return Array.isArray(arr)?{arr,as,from}:{err:true};
}

      if(['hs_kol','hs_kolx','hs_smart','hs_xav'].includes(k)){let cur={},inc={};try{cur=JSON.parse(localStorage.getItem(k)||'{}')||{};inc=JSON.parse(v)||{};}catch(e){}

function buildProfile(w,hist){
  const txs=hist.txs.filter(t=>!t.transactionError).sort((a,b)=>a.timestamp-b.timestamp);
  const pos={};let funder=null;const P=m=>pos[m]||(pos[m]={c:0,r:0,b:0,s:0,f:null,fs:null,l:null,fi:0});
  for(const tx of txs){
    const tt=tx.tokenTransfers||[];
    if(!funder&&hist.complete){const nt=(tx.nativeTransfers||[]).find(n=>n.toUserAccount===w&&n.fromUserAccount&&n.fromUserAccount!==w&&n.amount>1e6);if(nt)funder=nt.fromUserAccount;}
    const ins={},outs={};
    for(const x of tt){if(SKIP.has(x.mint))continue;const a=+x.tokenAmount||0;if(x.toUserAccount===w)ins[x.mint]=(ins[x.mint]||0)+a;if(x.fromUserAccount===w)outs[x.mint]=(outs[x.mint]||0)+a;}
    const im=Object.keys(ins),om=Object.keys(outs);if(!im.length&&!om.length)continue;
    const ad=(tx.accountData||[]).find(a=>a.account===w);let sol=(ad?ad.nativeBalanceChange:0)/1e9;
    for(const x of tt){if(x.mint!==WSOL)continue;if(x.toUserAccount===w)sol+=+x.tokenAmount||0;if(x.fromUserAccount===w)sol-=+x.tokenAmount||0;}
    if(im.length===1&&!om.length){const p=P(im[0]);if(-sol>=Math.max(SCAN.minSol,0.002)){p.c+=-sol;p.b+=ins[im[0]];}else p.fi+=ins[im[0]];if(p.f==null){p.f=tx.timestamp;p.fs=tx.slot;}}
    else if(om.length===1&&!im.length){const p=P(om[0]);if(sol>=0.002){p.r+=sol;p.s+=outs[om[0]];p.l=tx.timestamp;}}
  }
  const span=txs.length>1?txs[txs.length-1].timestamp-txs[0].timestamp:0;
  return{w,n:txs.length,complete:hist.complete,funder,perHour:span>0?txs.length/(span/3600):0,oldest:txs.length?txs[0].timestamp:null,pos};
}
function scoreWallet(pr,mint){
  const closed=[],holds=[];
  for(const [m,p] of Object.entries(pr.pos)){if(m===mint)continue;if(p.c>=SCAN.minSol&&p.b>0&&p.s>=p.b*0.8){closed.push({pnl:p.r-p.c,x:p.r/p.c});if(p.f&&p.l)holds.push(p.l-p.f);}}
  const wins=closed.filter(c=>c.pnl>0).length,t=mint?pr.pos[mint]:null;
  return{w:pr.w,closed:closed.length,wins,wr:closed.length?wins/closed.length*100:null,tokens:Object.keys(pr.pos).length,pnl:closed.reduce((s,c)=>s+c.pnl,0),bigWins:closed.filter(c=>c.x>=3).length,medHold:median(holds),funder:pr.funder,
    fresh:pr.complete&&(pr.n<20||(pr.oldest&&Date.now()/1000-pr.oldest<3*86400)),bot:pr.perHour>40&&pr.n>=100,target:t?{firstBuy:t.f,slot:t.fs,cost:t.c,free:t.fi>0&&t.c===0,sold:t.s>0}:null};
}
const isSmart=a=>a.closed>=SCAN.minClosed&&a.wr>=SCAN.minWR&&a.tokens>=SCAN.minTok&&a.pnl>0&&(a.medHold==null||a.medHold/60>=SCAN.minHoldMin)&&!a.fresh&&!a.bot;
function saveWC(){const e=Object.entries(WCACHE).filter(([,v])=>Date.now()-v.t<CACHE_TTL).sort((a,b)=>b[1].t-a[1].t).slice(0,350);WCACHE=Object.fromEntries(e);store.set('hs_wc',WCACHE);}
async function walletFor(w,mint){
  const c=WCACHE[w];if(c&&Date.now()-c.t<CACHE_TTL&&(c.p.pos[mint]||c.p.complete))return scoreWallet(c.p,mint);
  const pr=buildProfile(w,await txHistory(w,SCAN.pages));WCACHE[w]={t:Date.now(),p:pr};return scoreWallet(pr,mint);
}
async function scanHolders(t,onStep){
  const mi=await rpc('getAccountInfo',[t.mint,{encoding:'jsonParsed'}]);const info=mi?.value?.data?.parsed?.info;if(!info)throw new Error('Not a token');
  const supply=+info.supply/10**info.decimals;
  const la=await rpc('getTokenLargestAccounts',[t.mint]);const acc=(la?.value||[]).slice(0,20);
  const ta=await rpc('getMultipleAccounts',[acc.map(a=>a.address),{encoding:'jsonParsed'}]);
  const hs=acc.map((a,i)=>({pct:supply?(a.uiAmount||0)/supply*100:0,owner:ta?.value?.[i]?.data?.parsed?.info?.owner})).filter(h=>h.owner);
  const oi=await rpc('getMultipleAccounts',[hs.map(h=>h.owner),{encoding:'base64',dataSlice:{offset:0,length:0}}]);
  hs.forEach((h,i)=>{const o=oi?.value?.[i];h.pool=BURN.has(h.owner)||POOL_AUTH.has(h.owner)||h.owner===t.pair?.pairAddress||(o&&o.owner!==SYSTEM)||!o;});
  const people=hs.filter(h=>!h.pool),toScan=people.slice(0,SCAN.nHold);
  let done=0;stopScan=false;
  await pool(toScan,LIMITS[PLAN].par,async h=>{try{h.a=await walletFor(h.owner,t.mint);h.smart=isSmart(h.a);}catch(e){h.err=1;}onStep(++done,toScan.length);},()=>stopScan);
  const bySlot={},byF={};
  toScan.forEach(h=>{const s=h.a?.target?.slot;if(s)(bySlot[s]=bySlot[s]||[]).push(h);const f=h.a?.funder;if(f)(byF[f]=byF[f]||[]).push(h);});
  Object.values(bySlot).forEach(g=>{if(g.length>1)g.forEach(h=>h.bundled=true);});
  Object.values(byF).forEach(g=>{if(g.length>1)g.forEach(h=>h.cluster=short(g[0].a.funder));});
  const launch=launchTime(t);
  toScan.forEach(h=>{const fb=h.a?.target?.firstBuy;if(fb&&launch){h.entry=fb-launch;h.sniper=h.entry<=15&&h.entry>=-5;}if(h.smart&&(h.bundled||h.cluster||h.a.target?.free))h.smart=false;
    if(h.smart&&!SMART[h.owner])SMART[h.owner]={t:Date.now(),src:'auto',wr:h.a.wr,closed:h.a.closed};});
  store.set('hs_smart',SMART);saveWC();
  const top10=people.slice(0,10).reduce((s,h)=>s+h.pct,0);t.top10=top10;
  const sc=toScan.filter(h=>h.a),smart=sc.filter(h=>h.smart),sumP=f=>toScan.filter(f).reduce((s,h)=>s+h.pct,0);
  const ex=readExt(info),auth={mint:!!info.mintAuthority,freeze:!!info.freezeAuthority,tax:ex.tax,hook:ex.hook};
  const R={toScan,sc,smart,top10,auth,bun:sumP(h=>h.bundled),snip:launch?sumP(h=>h.sniper):null,clu:sumP(h=>h.cluster),fr:sumP(h=>h.a?.target?.free)};
  return Object.assign(R,buildChecks(t,R));
}

  const V=rugVals(t,R),top10=V.top10;

    if(pool)main=await fetchOHLCV(pool,CH.tf);
    if(main.length<2)for(const pl of(t.pairs||[]).map(x=>x.pairAddress).filter(a=>a&&a!==t.pair?.pairAddress)){main=await fetchOHLCV(pl,CH.tf);if(main.length>=2){pool=pl;break;}}
  }catch(e){console.warn('chart',e);}
  if(my!==CHSEQ||!$('chart')||$('vDetail').classList.contains('hide'))return;
  if(!window.LightweightCharts||main.length<2){dexEmbed(t);$('chNote').textContent='No candle data yet — showing the DexScreener chart instead.';return;}
  box.innerHTML='';
  const up=cssVar('--good')||'#22c55e',dn=cssVar('--bad')||'#f43f5e',mut=cssVar('--mut'),line=cssVar('--line');
  const mult=CH.mode==='mc'&&t.price&&t.mc?t.mc/t.price:1;
  const fmt=v=>v<0?'':CH.mode==='mc'?usd(v):fmtPriceTxt(v);
  const ch=LightweightCharts.createChart(box,{height:box.clientHeight||330,width:box.clientWidth,
    layout:{background:{type:'solid',color:'transparent'},textColor:mut,fontSize:11,fontFamily:'-apple-system,Roboto,Inter,sans-serif'},
    grid:{vertLines:{visible:false},horzLines:{color:line,style:1}},
    rightPriceScale:{borderVisible:false,scaleMargins:{top:.16,bottom:.22}},
    timeScale:{borderVisible:false,timeVisible:CH.tf!=='1d',secondsVisible:false,rightOffset:3,barSpacing:7},
    crosshair:{mode:0,vertLine:{color:mut,labelBackgroundColor:cssVar('--chip2')},horzLine:{color:mut,labelBackgroundColor:cssVar('--chip2')}},
    handleScroll:true,handleScale:true});
  const se=ch.addCandlestickSeries({upColor:up,downColor:dn,borderUpColor:up,borderDownColor:dn,wickUpColor:up,wickDownColor:dn,priceFormat:{type:'custom',formatter:fmt,minMove:1e-12}});
  const vol=ch.addHistogramSeries({priceScaleId:'vol',priceFormat:{type:'volume'},lastValueVisible:false,priceLineVisible:false});
  ch.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});
  chartObj=ch;CHS={t,se,vol,mult,fmt,up,dn,tf:CH.tf,mode:CH.mode,pool,candles:[],merged:false};
  setChartData(main);
  ch.subscribeCrosshairMove(p=>{if(!CHS)return;if(!p||!p.time){legend(null);return;}const c=CHS.candles.find(x=>x.time+TZS===p.time);legend(c);});
  chRO=new ResizeObserver(()=>{try{ch.applyOptions({width:box.clientWidth});}catch(e){}});chRO.observe(box);
  $('chKol').innerHTML=kolStrip(t);
  const note=()=>{$('chNote').textContent=`${CH.mode==='mc'?'Market cap':'Price'} · ${CH_TF.find(x=>x[0]===CH.tf)[1]} candles${CHS?.merged?' · full history: bonding curve → migrated pool':''} · GeckoTerminal`;};
  note();
  // migrated token: stitch the bonding-curve candles in front of the AMM candles → one chart from launch
  if(t.stage==='mig'){
    try{
      const cp=curvePool(t,await gtPools(t));if(my!==CHSEQ||!cp||cp===pool)return;
      const step=tfStep(CH.tf);let pages=0;
      while(main.length>=1000&&pages<2&&t.gradAt&&main[0].time>t.gradAt/1000+step){const more=await fetchOHLCV(pool,CH.tf,main[0].time);if(my!==CHSEQ)return;if(!more.length)break;main=mergeCandles(more,main);pages++;}
      const curve=await fetchOHLCV(cp,CH.tf);if(my!==CHSEQ||!CHS)return;
      if(curve.length&&curve[curve.length-1].time>=main[0].time-step*30){
        const pre=curve.filter(c=>c.time<main[0].time);
        if(pre.length){CHS.merged=true;setChartData(mergeCandles(pre,main,CHS.candles.filter(c=>c.time>main[main.length-1].time)));note();}
      }else if(curve.length)$('chNote').textContent+=' · pick a bigger timeframe to see the bonding-curve part too';
    }catch(e){}
  }
}
async function chartLive(){
  if(!CHS||!chartObj||CH.src!=='native'||CHS.tf!==CH.tf||CHS.mode!==CH.mode||!CHS.pool)return;
  try{const c=await fetchOHLCV(CHS.pool,CHS.tf,null,3);if(!CHS)return;const up=CHS.up,dn=CHS.dn;
    c.filter(x=>x.time>=CHS.last).forEach(x=>{CHS.se.update({time:x.time+TZS,open:x.open*CHS.mult,high:x.high*CHS.mult,low:x.low*CHS.mult,close:x.close*CHS.mult});CHS.vol.update({time:x.time+TZS,value:x.value,color:x.close>=x.open?up+'55':dn+'55'});
      const i=CHS.candles.findIndex(y=>y.time===x.time);if(i>=0)CHS.candles[i]=x;else CHS.candles.push(x);CHS.last=x.time;});
    CHS.se.setMarkers(chartMarkers(CHS.t,CHS.candles,up,dn));legend(null);const k=$('chKol');if(k)k.innerHTML=kolStrip(CHS.t);}catch(e){}
}
function wireChart(t){
  const saveCH=()=>store.set('hs_chart',CH);
  const seg=(id,key)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{CH[key]=b.dataset.v;saveCH();$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawChart(t);});
  seg('chTf','tf');seg('chMode','mode');seg('chSrcSeg','src');
  drawChart(t);
}
window.addEventListener('popstate',()=>{if(!$('sheet').classList.contains('hide')){closeSheet();if(!$('vDetail').classList.contains('hide'))history.pushState({d:1},'');return;}if(!$('vDetail').classList.contains('hide')){stopScan=true;DT=null;CHSEQ++;if(chRO){try{chRO.disconnect();}catch(e){}chRO=null;}if(chartObj){try{chartObj.remove();}catch(e){}chartObj=null;}CHS=null;$('vDetail').classList.add('hide');}});

document.addEventListener('click',e=>{const b=e.target.closest('[data-fav]');if(b){e.preventDefault();e.stopPropagation();toggleFav(b.dataset.fav);if(TAB==='sw'&&FILT.sw.mode==='favs'&&$('sheet').classList.contains('hide'))renderSW();if(TAB==='kol'&&FILT.kol.mode==='favs'&&$('sheet').classList.contains('hide'))renderKol();}},true);
// ================= theme =================
function applyTheme(th){document.documentElement.dataset.theme=th;$('themeBtn').textContent=th==='light'?'🌙':'☀️';document.querySelector('meta[name=theme-color]').setAttribute('content',th==='light'?'#f4f6fb':'#090b10');}
let THEME=store.get('hs_theme',null)||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
applyTheme(THEME);
$('themeBtn').onclick=()=>{THEME=THEME==='light'?'dark':'light';store.set('hs_theme',THEME);applyTheme(THEME);};

// ================= wiring =================
// tab bar: ⚡ Alpha (with a drop-down: All · KOL · Smart money) and ＋ Add
const fMenu=on=>{$('fMenu').classList.toggle('hide',!on);$('tFeed').classList.toggle('open',on);};
$('tabs').onclick=e=>{
  const it=e.target.closest('[data-k]');
  if(it){fMenu(false);const k=it.dataset.k;FEEDK=k;store.set('hs_feedk',k);if(TAB!==k){TAB=k;store.set('hs_tab',TAB);renderControls();renderList();window.scrollTo(0,0);}else renderControls();return;}
  const b=e.target.closest('button[data-t]');if(!b)return;
  if(b.dataset.t==='feed'){if(FEEDS.includes(TAB)){fMenu($('fMenu').classList.contains('hide'));return;}TAB=FEEDK;}
  else{fMenu(false);TAB=b.dataset.t;}
  store.set('hs_tab',TAB);renderControls();renderList();window.scrollTo(0,0);};
document.addEventListener('click',e=>{if(!e.target.closest('#tabs'))fMenu(false);},true);
$('tfRow').onclick=e=>{const b=e.target.closest('[data-tf]');if(!b)return;FILT[TAB].tf=b.dataset.tf;FILT[TAB].sort='vol';saveFilt();renderControls();renderList();queueTop10();};
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-kp]');if(!b)return;const p=KOL_PRESETS.find(x=>x[0]===b.dataset.kp);FILT.kol={...FILT.kol,age:[null,null],pos:'all',favOnly:false,...p[2],preset:p[0]};saveFilt();renderControls();renderList();});
$('presets').onclick=e=>{const b=e.target.closest('[data-p]');if(b)applyPreset(b.dataset.p);const sp=e.target.closest('[data-sp]');if(sp){const p=SW_TPRESETS.find(x=>x[0]===sp.dataset.sp),o=FILT.sw;FILT.sw={...o,age:[null,null],pos:'all',favOnly:false,verified:false,...p[2],preset:p[0]};saveFilt();renderControls();renderSW();}};
$('viewRow').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;TAB=b.dataset.v;store.set('hs_tab',TAB);store.set('hs_view',TAB);renderControls();renderList();queueTop10();window.scrollTo(0,0);};
$('sortSel').onchange=()=>{FILT[TAB].sort=$('sortSel').value;saveFilt();renderList();};
$('filtBtn').onclick=()=>{if(FEEDS.includes(TAB))feedFilterSheet(TAB);};$('setBtn').onclick=settingsSheet;$('srchBtn').onclick=searchSheet;$('refBtn').onclick=()=>refresh(true);
$('list').onclick=async e=>{if(e.target.closest('a'))return;const wx=e.target.closest('[data-wx]');if(wx){e.stopPropagation();const m=wx.dataset.wx;WEXP.has(m)?WEXP.delete(m):WEXP.add(m);renderSoft();return;}
  const nm=e.target.closest('[data-nm]');if(nm){e.stopPropagation();const m=nm.dataset.nm;NAMEFULL.has(m)?NAMEFULL.delete(m):NAMEFULL.add(m);nm.classList.toggle('full',NAMEFULL.has(m));return;}const kw=e.target.closest('[data-kw]');if(kw){e.stopPropagation();openKol(kw.dataset.kw);return;}
  const hm=e.target.closest('[data-hm]');if(hm){e.stopPropagation();const m=hm.dataset.hm;let t=TOK.get(m);if(!t||!t.pair){try{const arr=await getJSON('https://api.dexscreener.com/tokens/v1/solana/'+m);t=tok(m);t.seen=Date.now();t.pairs=(Array.isArray(arr)?arr:[]).filter(p=>p.baseToken?.address===m);if(t.pairs.length)derive(t);}catch(err){}}if(t&&t.pair)openDetail(m);else toast('No market data for this token');return;}const cp=e.target.closest('[data-cp]');if(cp){e.stopPropagation();copy(cp.dataset.cp);return;}const c=e.target.closest('.tc,.kt');if(c&&TOK.get(c.dataset.m)?.pair)openDetail(c.dataset.m);};
$('kPlan').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('kPlan').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
$('kGo').onclick=async()=>{const k=$('kIn').value.trim();if(k.length<20){$('kErr').textContent='That key looks too short.';return;}
  KEY=k;PLAN=$('kPlan').querySelector('.on').dataset.v;$('kGo').textContent='Checking…';
  try{await rpc('getSlot',[]);store.set('hs_key',KEY);store.set('hs_plan',PLAN);start();}catch(e){$('kErr').textContent=e.message;}
  $('kGo').textContent='Start scanning';};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('instBtn').classList.remove('hide');});
$('instBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('instBtn').classList.add('hide');};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

function start(){REFRESH_MS=PLAN==='paid'?35e3:60e3;$('vSetup').classList.add('hide');$('vMain').classList.remove('hide');renderControls();
  if(hookOn()){hookPoll();setTimeout(()=>hookSync(),6000);if(!lastTrack)lastTrack=Date.now()-4*60e3;}   // webhook keeps everything while the app is closed: first safety check after ~1 min
  setTimeout(()=>{if(SET.live!==false)liveStart();},4000);
  {const p=readAddHash()||store.get('hs_pendadd',null);if(p){store.set('hs_pendadd',null);setTimeout(()=>applyAdd(p),600);}}
  const cached=loadTokCache();if(cached){renderList();setLive('busy','updating…');}else renderList(true);
  // quick first paint: market data for cached tokens straight away (DexScreener, no Helius), then the full refresh
  if(cached)loadMarket().then(()=>{lastFast=Date.now();renderList();});
  refresh(true);schedule();}
if(KEY)start();else{$('vSetup').classList.remove('hide');const p=readAddHash();if(p&&!p.err){store.set('hs_pendadd',p);}}
